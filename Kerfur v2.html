<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kerfur — Maslov Oleksandr</title>
  <meta name="description" content="Kerfur · project case file · Maslov Oleksandr · emotional companion device · nRF52840 · Zephyr · live face engine demo." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />

  <link rel="stylesheet" href="system/tokens.css" />
  <link rel="stylesheet" href="system/layout.css" />
  <link rel="stylesheet" href="system/extras.css" />
  <link rel="stylesheet" href="project/page.css" />
  <link rel="stylesheet" href="project_v2/page2.css" />
  <link rel="stylesheet" href="demo/demo.css" />
  <link rel="stylesheet" href="demo/demo2.css" />
  <link rel="stylesheet" href="lab/ascii-photo/ascii-figure.css" />
  <link rel="stylesheet" href="landing_v11/cursor-ascii.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Three.js (ESM) exposed on window.THREE for the Babel scripts below -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    window.THREE = Object.assign({}, THREE, { GLTFLoader, MeshoptDecoder, RoomEnvironment, RoundedBoxGeometry });
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared system (FibGrid, Boot, Cursor) -->
  <script type="text/babel" data-presets="env,react" src="system/core.jsx"></script>

  <!-- PLAY DEMO · field core + kerfur palette + face/emotion/body engines + controller -->
  <script src="demo/field-core.js"></script>
  <script src="demo/kerfur-sound.js"></script>
  <script src="demo/kerfur-face.js"></script>
  <script src="demo/kerfur-emotion.js"></script>
  <script src="demo/kerfur-model.js"></script>
  <script src="demo/kerfur-demo.js"></script>

  <!-- ASCII photo reveal-lens (lab engine + React figure wrapper) -->
  <script src="lab/ascii-photo/ascii-photo.js"></script>

  <!-- Project pieces -->
  <script type="text/babel" data-presets="env,react" src="project/data.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project/viewer3d.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project_v2/hero-rig.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project_v2/tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="lab/ascii-photo/ascii-figure.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="demo/kerfur-hud.jsx"></script>

  <!-- Page config — everything project-specific lives here -->
  <script type="text/babel" data-presets="env,react">
    window.PAGE_CONFIG = {
      addr: "0x02",
      docTitle: "Kerfur — Maslov Oleksandr",
      hero: {
        /* procedural cat-pebble with the LIVE face engine on its OLED —
           the page hero is already alive before the demo starts.
           Real GLB swaps in via FUSION-EXPORT-GUIDE.md later. */
        matcap: false,
        modelFit: 3.4,
        pose: { x: 0.06, y: -0.38, z: 0 },
        buildModel: (THREE) => {
          const body = window.makeKerfurBody(THREE);
          window.__heroKerfur = body;
          /* self-driven tick: hero rig renders continuously, we only
             need to keep the face engine + springs advancing */
          let last = performance.now();
          const tick = (now) => {
            body.update(now, now - last);
            last = now;
            if (!window.__hv_leaving) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
          /* a calm pet on its shelf: occasional ambient glances */
          setInterval(() => {
            if (document.body.classList.contains("hv-demoing")) return;
            const f = body.face;
            const r = Math.random();
            if (r < 0.45) f.setLook((Math.random() - 0.5) * 120, (Math.random() - 0.5) * 60);
            else if (r < 0.55) f.react("REACTION_GLANCE_LEFT");
            else f.setLook(0, 0);
          }, 3400);
          return body.group;
        },
      },
      demo: {
        layerName: "KerfurDemoLayer",
        hint: "PET · SHAKE · NOTIFY · MEET",
        label: "PLAY DEMO",
      },
      tweakDefaults: /*EDITMODE-BEGIN*/{
        "direction": "cinematic",
        "hud": "full",
        "soundLevel": 0.8,
        "presence": 49,
        "space": 100,
        "rippleStrength": 99,
        "constellation": 200
      }/*EDITMODE-END*/,
      renderTweaks: (t, set) => (
        <>
          <TweakSection label="Demo" />
          <TweakRadio label="Direction" value={t.direction}
                      options={["cinematic", "sandbox"]}
                      onChange={(v) => set("direction", v)} />
          <TweakRadio label="HUD density" value={t.hud}
                      options={["full", "minimal"]}
                      onChange={(v) => set("hud", v)} />
          <TweakSection label="Sound" />
          <TweakSlider label="Field level" value={t.soundLevel} min={0} max={1} step={0.05}
                       onChange={(v) => set("soundLevel", v)} />
        </>
      ),
    };
  </script>

  <!-- Page core (generalized v2 template) -->
  <script type="text/babel" data-presets="env,react" src="project_v2/page-core.jsx"></script>

  <!-- ASCII RAMP scrollbar (shared w/ Landing v11) -->
  <script src="landing_v11/landing-scrollbar.js"></script>
</body>
</html>
