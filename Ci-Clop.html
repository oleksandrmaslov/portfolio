<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ci-Clop — Maslov Oleksandr</title>
  <meta name="description" content="Tactical Flashlight · project case file · Maslov Oleksandr · volunteer firmware · PY32F002A · Energy for Ukraine." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" />

  <link rel="stylesheet" href="app/shared/styles/tokens.css" />
  <link rel="stylesheet" href="app/shared/styles/key.css" />
  <link rel="stylesheet" href="app/shared/styles/layout.css" />
  <link rel="stylesheet" href="app/shared/styles/components.css" />
  <link rel="stylesheet" href="app/projects/styles/base.css" />
  <link rel="stylesheet" href="app/projects/styles/case-study.css" />
  <link rel="stylesheet" href="demo/base.css" />
  <link rel="stylesheet" href="demo/controls.css" />
  <link rel="stylesheet" href="app/projects/components/ascii-photo.css" />
  <link rel="stylesheet" href="app/shared/styles/pointer.css?v=20260822-2" />
  <link rel="stylesheet" href="app/shared/styles/scrollbar.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Three.js (ESM) + GLTFLoader + MeshoptDecoder + RoomEnvironment, exposed
       on window.THREE for the non-module Babel-standalone scripts below. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    window.THREE = Object.assign({}, THREE, { GLTFLoader, MeshoptDecoder, RoomEnvironment, RoundedBoxGeometry });
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared system (Cursor, shell) -->
  <script type="text/babel" data-presets="env,react" src="app/shared/core.jsx"></script>

  <!-- PLAY DEMO · field sound core + torch palette + procedural torch + controller -->
  <script src="demo/field-core.js"></script>
  <script src="demo/torch-sound.js"></script>
  <script src="demo/torch-model.js"></script>
  <script src="demo/torch-demo.js"></script>

  <!-- ASCII photo reveal-lens (lab engine + React figure wrapper) -->
  <script src="app/projects/components/ascii-photo.js"></script>

  <!-- Project pieces -->
  <script type="text/babel" data-presets="env,react" src="app/projects/data.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="app/projects/rendering/model-viewer.jsx"></script>
  <script src="app/projects/rendering/solid-materials.js"></script>
  <script type="text/babel" data-presets="env,react" src="app/projects/rendering/solid-hero-rig.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="app/projects/components/tweak-panel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="app/projects/components/ascii-photo.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="demo/torch-hud.jsx"></script>

  <!-- Page config — everything project-specific lives here -->
  <script type="text/babel" data-presets="env,react">
    window.PAGE_CONFIG = {
      addr: "0x04",
      docTitle: "Ci-Clop — Maslov Oleksandr",
      hero: {
        model: "models/tactical_flashlight.glb",
        /* This GLB ships no materials at all — 7 meshes, 0 materials — so it
           takes the house solid instead of the real-material tuner. Without
           it the shared rig draws flat white. The spec is the one the landing
           flight already feeds 0x04 (assignMaterial for 0x04 in
           app/data/projects.js) — keep the two equal or the seam changes
           colour mid-flight. */
        assignMaterial: { color: 0x4b5a32, metalness: 0.28, roughness: 0.62 },
        /* modelFit is deliberately absent: the shared rig's 4.0 default is
           what rigFit for 0x04 in app/data/projects.js already claims to
           match. The retired rig defaulted to 4.1, so that claim was false. */
        pose: { x: 0.5, y: 0.35, z: -0.5 },   // lies at a ready angle, head toward camera
      },
      demo: {
        layerName: "TorchDemoLayer",
        hint: "SW1 · SW2 · SOS · BATT",
        label: "PLAY DEMO",
      },
      tweakDefaults: /*EDITMODE-BEGIN*/{
        "direction": "cinematic",
        "hud": "full",
        "clickPitch": 1,
        "soundLevel": 0.8,
        "drainSpeed": 1
      }/*EDITMODE-END*/,
      renderTweaks: (t, set) => (
        <>
          <TweakSection label="Demo" />
          <TweakRadio label="Direction" value={t.direction}
                      options={["cinematic", "sandbox"]}
                      onChange={(v) => set("direction", v)} />
          <TweakRadio label="HUD density" value={t.hud}
                      options={["full", "minimal"]}
                      onChange={(v) => set("hud", v)} />
          <TweakSection label="Firmware sim" />
          <TweakSlider label="Drain speed" value={t.drainSpeed} min={0.25} max={4} step={0.25}
                       onChange={(v) => set("drainSpeed", v)} />
          <TweakSection label="Sound" />
          <TweakSlider label="Click pitch" value={t.clickPitch} min={0.7} max={1.3} step={0.05}
                       onChange={(v) => set("clickPitch", v)} />
          <TweakSlider label="Field level" value={t.soundLevel} min={0} max={1} step={0.05}
                       onChange={(v) => set("soundLevel", v)} />
        </>
      ),
    };
  </script>

  <!-- Shared project page and pointer effects -->
  <script src="app/shared/pointer-effects.js"></script>
  <script type="text/babel" data-presets="env,react" src="app/projects/pages/standard-page.jsx"></script>

  <!-- Shared ASCII RAMP scrollbar -->
  <script src="app/shared/scrollbar.js"></script>
</body>
</html>
