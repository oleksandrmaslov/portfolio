    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    window.THREE = Object.assign({}, THREE, { GLTFLoader, MeshoptDecoder, RoomEnvironment });
  </script>

  <script src="app/data/projects.js?v=80fff50bac00"></script>

  <!-- Page config — everything project-specific lives here. Inert in the
       page: build.cjs compiles it into the page runtime above. -->
  <script type="text/plain" data-page-runtime-source="ci-clop-config">
    window.PAGE_CONFIG = {
      addr: "0x04",
      docTitle: "Ci-Clop — Maslov Oleksandr",
      hero: {
        model: "models/ci-clop-mark.glb",
        /* The rig's 4.0 default is Wafer's, a full split keyboard. 3.0 is the
           framing the materials gallery approved for this revision. rigFit for
           0x04 in app/data/projects.js mirrors it: keep the two equal or the
           mark changes size halfway through the flight. */
        modelFit: 3.0,
        pose: { x: 0.45, y: 0.75, z: 0 },   // three-quarter: the LED face, the lid seam, the bed pad
      },
      demo: {
        layerName: "TorchDemoLayer",
        hint: "SW1 · SW2 · SOS · BATT",
        label: "PLAY DEMO",
        tweaks: { direction: "cinematic", hud: "full", clickPitch: 1, soundLevel: 0.8, drainSpeed: 1 },

    };
