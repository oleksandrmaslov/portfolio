<body>
  <div id="root"></div>

  <!-- SEAM BRIDGE — arriving from the landing node flight: paint the captured
       final frame instantly so the model never blinks out during boot. -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem("mo_node_arrive") !== "1") return;
        if (sessionStorage.getItem("mo_node_addr") !== "0x02") return;
        var img = sessionStorage.getItem("mo_node_seam");
        if (!img) return;
        var d = document.createElement("div");
        d.id = "mo-seam";
        d.style.cssText = "position:fixed;inset:0;z-index:60;background:transparent center center / cover no-repeat;pointer-events:none;";
        d.style.backgroundImage = "url(" + img + ")";
        document.body.appendChild(d);
        // The label is text, and text is a contentful paint: it waits for the
        // frame to decode, so the browser keeps holding the landing's last
        // frame (the same picture) instead of releasing on the bare void.
        var tag = Object.assign(document.createElement("div"), { className: "mo-seam__tag", textContent: "KERFUR" });
        var im = new Image(); im.src = img;
        var label = function () { d.appendChild(tag); };
        (im.decode ? im.decode() : Promise.resolve()).then(label, label);
      } catch (e) {}
    })();
  </script>

  <!-- Three.js (ESM) on window.THREE. A module script is deferred, so it runs
       before the deferred page runtime below. RoundedBoxGeometry is for the
       procedural Kerfur body (demo/kerfur-model.js). -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    window.THREE = Object.assign({}, THREE, { GLTFLoader, MeshoptDecoder, RoomEnvironment, RoundedBoxGeometry });
  </script>

  <script src="app/data/projects.js?v=605a1b9a8f84"></script>

  <!-- React + precompiled page runtime -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

  <!-- Page runtime: shared core, PLAY DEMO (field core, kerfur sound, face,
       emotion and body engines, controller, HUD), project data, hero rig,
       ASCII figures, the page config below, pointer effects, KeyButton,
       project page and scrollbar -->
  <!-- Shared sampled player; its URL anchors the instrument bank. -->
  <script defer src="app/landing/audio/generative-score.js?v=648041285c18"></script>
  <script defer src="app/landing/audio/sample-engine.js?v=9a236b68a51e"></script>
  <script defer src="app/page-runtimes/kerfur-page.js?v=eca175344f04"></script>

  <!-- Page config — everything project-specific lives here. Inert in the
       page: build.cjs compiles it into the page runtime above. -->
  <script type="text/plain" data-page-runtime-source="kerfur-config">
    window.PAGE_CONFIG = {
      addr: "0x02",
      bridgeSeam: true,   // drop the #mo-seam frame painted above once the model draws
      docTitle: "Kerfur — Maslov Oleksandr",
      hero: {
        /* procedural cat-pebble with the LIVE face engine on its OLED —
           the page hero is already alive before the demo starts.
           A production GLB can replace the procedural body without changing the page contract. */
        keepMaterials: true,
        modelFit: 3.4,
        pose: { x: 0.06, y: -0.38, z: 0 },
        buildModel: (THREE) => {
          const body = window.makeKerfurBody(THREE);
          /* Advance the face and springs inside the shared hero loop. This
             pauses with the offscreen renderer instead of running a second
             permanent RAF plus interval for the lifetime of the page. */
          let nextGlance = performance.now() + 3400;
          return {
            group: body.group,
            update(now, dt) {
              body.update(now, dt);
              if (now < nextGlance) return;
              nextGlance = now + 3400;
              if (document.body.classList.contains("hv-demoing")) return;
              const f = body.face;
              const r = Math.random();
              if (r < 0.45) f.setLook((Math.random() - 0.5) * 120, (Math.random() - 0.5) * 60);
              else if (r < 0.55) f.react("REACTION_GLANCE_LEFT");
              else f.setLook(0, 0);
            },
          };
        },
      },
      demo: {
        layerName: "KerfurDemoLayer",
        hint: "PET · SHAKE · NOTIFY · MEET",
        label: "PLAY DEMO",
        tweaks: { direction: "cinematic", hud: "full", soundLevel: 0.8 },
      },
    };
  </script>
