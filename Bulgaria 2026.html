<body>
  <div id="root"></div>

  <!-- SEAM BRIDGE — arriving from the landing node flight: paint the captured
       final frame instantly so the model never blinks out during boot. -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem("mo_node_arrive") !== "1") return;
        if (sessionStorage.getItem("mo_node_addr") !== "0x0D") return;
        var img = sessionStorage.getItem("mo_node_seam");
        if (!img) return;
        var d = document.createElement("div");
        d.id = "mo-seam";
        d.style.cssText = "position:fixed;inset:0;z-index:60;background:#04060d center center / cover no-repeat;transition:opacity .55s cubic-bezier(0.16,1,0.3,1);pointer-events:none;";
        d.style.backgroundImage = "url(" + img + ")";
        d.appendChild(Object.assign(document.createElement("div"), {
          className: "mo-seam__tag",
          textContent: "BULGARIA 2026"
        }));
        document.body.appendChild(d);
      } catch (e) {}
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
