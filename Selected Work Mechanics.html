<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Selected work · scroll mechanic variations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />

  <link rel="stylesheet" href="system/tokens.css" />
  <link rel="stylesheet" href="system/extras.css" />

  <style>
    body { background: #07090f; overflow: hidden; }

    /* ============================================================
       Shared card visual (used in all variations)
       ============================================================ */
    .miniCard {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(13,16,24,0.92) 0%, rgba(8,11,18,0.92) 100%);
      border: 1px solid var(--hairline);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    .miniCard__chrome {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--hairline);
      background: rgba(0,240,200,0.03);
      font-family: var(--ff-mono);
      font-size: 9px;
      letter-spacing: var(--tr-caps);
      text-transform: uppercase;
      color: var(--ghost);
    }
    .miniCard__dot { width: 5px; height: 5px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 6px var(--signal); }
    .miniCard__addr { color: var(--signal); }
    .miniCard__year { color: var(--bone); }
    .miniCard__sep { width: 10px; height: 1px; background: var(--hairline); }
    .miniCard__art {
      position: relative;
      margin: 12px;
      background:
        radial-gradient(ellipse at 50% 60%, rgba(0,240,200,0.05) 0%, transparent 50%),
        var(--space);
      border: 1px solid rgba(255,255,255,0.04);
      overflow: hidden;
    }
    .miniCard__art::before {
      content: "";
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 12px);
    }
    .miniCard__corner {
      position: absolute; width: 14px; height: 14px;
      border: 1px solid var(--signal); opacity: 0.6;
    }
    .miniCard__corner--tl { top: 10px; left: 10px;   border-right: 0; border-bottom: 0; }
    .miniCard__corner--tr { top: 10px; right: 10px;  border-left: 0;  border-bottom: 0; }
    .miniCard__corner--bl { bottom: 10px; left: 10px;  border-right: 0; border-top: 0; }
    .miniCard__corner--br { bottom: 10px; right: 10px; border-left: 0;  border-top: 0; }
    .miniCard__cross {
      position: absolute; left: 50%; top: 50%;
      width: 18px; height: 18px;
      transform: translate(-50%, -50%);
      background:
        linear-gradient(var(--signal), var(--signal)) center/1px 100% no-repeat,
        linear-gradient(var(--signal), var(--signal)) center/100% 1px no-repeat;
      opacity: 0.4;
    }
    .miniCard__foot {
      padding: 12px 14px;
      border-top: 1px solid var(--hairline);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }
    .miniCard__name {
      font-family: var(--ff-display);
      font-size: 28px;
      line-height: 0.95;
      letter-spacing: -0.02em;
      font-weight: 400;
      color: var(--bone);
      margin: 0;
    }
    .miniCard__name em { font-family: var(--ff-serif); font-style: italic; color: var(--signal); }
    .miniCard__sub {
      font-family: var(--ff-display);
      font-size: 12px;
      color: var(--ash);
    }
    .miniCard__open {
      font-family: var(--ff-mono);
      font-size: 9px;
      letter-spacing: var(--tr-caps);
      color: var(--signal);
    }

    /* ============================================================
       Variation container — fills the artboard, has its own scroll
       ============================================================ */
    .vbox {
      position: relative;
      width: 100%; height: 100%;
      background: var(--void);
      color: var(--bone);
      overflow: hidden;
    }
    .vbox__head {
      position: absolute; top: 24px; left: 32px; right: 32px;
      display: flex; justify-content: space-between; align-items: baseline;
      z-index: 5;
    }
    .vbox__title {
      font-family: var(--ff-display);
      font-size: 64px;
      line-height: 0.86;
      letter-spacing: -0.04em;
      color: var(--bone);
      margin: 0;
    }
    .vbox__title em { font-family: var(--ff-serif); font-style: italic; color: var(--signal); }
    .vbox__meta {
      font-family: var(--ff-mono);
      font-size: 10px;
      letter-spacing: var(--tr-caps);
      text-transform: uppercase;
      color: var(--ghost);
      text-align: right;
      line-height: 1.7;
    }
    .vbox__spine {
      position: absolute; bottom: 20px; left: 32px; right: 32px;
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--ff-mono); font-size: 10px;
      letter-spacing: var(--tr-caps); text-transform: uppercase;
      color: var(--ghost);
      z-index: 5;
    }
    .vbox__spineCount { color: var(--signal); }
    .vbox__spineRail {
      position: absolute; left: 32px; right: 32px; bottom: 38px;
      height: 1px; background: var(--hairline);
    }
    .vbox__spineFill {
      height: 1px; background: var(--signal);
      box-shadow: 0 0 6px var(--signal);
    }

    /* ============================================================
       A · LINEAR HORIZONTAL PAN — current commit
       ============================================================ */
    .vA__stage { position: absolute; inset: 120px 0 60px 0; overflow: hidden; }
    .vA__rail  {
      display: flex; gap: 32px; padding: 0 80px;
      height: 100%; align-items: center;
      transition: transform 600ms cubic-bezier(0.22,1,0.36,1);
    }
    .vA__slot { flex: 0 0 540px; height: 70%; }

    /* ============================================================
       B · CARD-IN-FOCUS — cards slide into center, scale up, fade edges
       ============================================================ */
    .vB__stage { position: absolute; inset: 120px 0 60px 0; }
    .vB__deck  {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .vB__card {
      position: absolute;
      width: 520px; height: 70%;
      transition: transform 600ms cubic-bezier(0.22,1,0.36,1), opacity 600ms;
      will-change: transform, opacity;
    }

    /* ============================================================
       C · FILMSTRIP DOLLY — cards stay in rail, camera moves
       Adds parallax: bg moves slower than cards
       ============================================================ */
    .vC__stage { position: absolute; inset: 120px 0 60px 0; overflow: hidden; }
    .vC__bg {
      position: absolute; inset: 0;
      background-image:
        repeating-linear-gradient(90deg, transparent 0 119px, rgba(0,240,200,0.06) 119px 120px),
        radial-gradient(ellipse at 30% 70%, rgba(0,240,200,0.05), transparent 40%);
      transition: transform 600ms cubic-bezier(0.22,1,0.36,1);
    }
    .vC__rail {
      position: absolute; top: 50%; left: 80px;
      transform: translateY(-50%);
      display: flex; gap: 28px;
      transition: transform 600ms cubic-bezier(0.22,1,0.36,1);
    }
    .vC__slot { flex: 0 0 460px; height: 360px; }
    .vC__lens {
      position: absolute; inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to right,  var(--void) 0%, transparent 12%, transparent 88%, var(--void) 100%);
    }
    .vC__reticle {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 540px; height: 380px;
      pointer-events: none;
    }
    .vC__reticle span {
      position: absolute;
      width: 24px; height: 24px;
      border: 1px solid var(--signal);
      opacity: 0.5;
    }
    .vC__reticle span:nth-child(1) { top: 0;     left: 0;     border-right: 0; border-bottom: 0; }
    .vC__reticle span:nth-child(2) { top: 0;     right: 0;    border-left: 0;  border-bottom: 0; }
    .vC__reticle span:nth-child(3) { bottom: 0;  left: 0;     border-right: 0; border-top: 0; }
    .vC__reticle span:nth-child(4) { bottom: 0;  right: 0;    border-left: 0;  border-top: 0; }
    .vC__lock {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, calc(-50% + 220px));
      font-family: var(--ff-mono);
      font-size: 10px;
      letter-spacing: var(--tr-caps);
      color: var(--signal);
      pointer-events: none;
    }

    /* ============================================================
       D · ABOUT — vertical stacked (legacy)
       ============================================================ */
    .vD {
      padding: 80px 64px 64px;
      height: 100%;
      overflow: auto;
      scrollbar-width: thin;
    }
    .vD__head {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      gap: 24px;
      align-items: end;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 32px;
    }
    .vD__num {
      font-family: var(--ff-mono);
      font-size: 10px;
      letter-spacing: var(--tr-caps);
      color: var(--signal);
      padding-left: 14px; position: relative;
    }
    .vD__num::before { content: "■"; position: absolute; left: 0; }
    .vD__title {
      font-family: var(--ff-display);
      font-size: 96px;
      line-height: 0.88;
      letter-spacing: -0.04em;
      font-weight: 400;
      color: var(--bone);
      margin: 0;
    }
    .vD__title em { font-family: var(--ff-serif); font-style: italic; color: var(--signal); }
    .vD__meta {
      font-family: var(--ff-mono); font-size: 10px;
      letter-spacing: var(--tr-caps); text-transform: uppercase;
      color: var(--ghost); text-align: right; line-height: 1.7;
    }
    .vD__grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 56px;
    }
    .vD__col p { font-family: var(--ff-display); font-size: 16px; line-height: 1.55; color: var(--ash); margin: 0 0 18px; max-width: 56ch; }
    .vD__col p:first-child { font-size: 20px; color: var(--bone); line-height: 1.4; }
    .vD__sheet {
      background: rgba(8,11,18,0.6);
      border: 1px solid var(--hairline);
      padding: 18px;
    }
    .vD__sheetHead {
      display: flex; justify-content: space-between;
      padding-bottom: 12px; margin-bottom: 12px;
      border-bottom: 1px solid var(--hairline);
      font-family: var(--ff-mono); font-size: 10px;
      letter-spacing: var(--tr-caps); text-transform: uppercase;
      color: var(--ghost);
    }
    .vD__sheetHead > span:first-child { color: var(--bone); }
    .vD__sheetRow {
      display: grid; grid-template-columns: 90px 1fr; gap: 12px;
      padding: 8px 0; border-bottom: 1px dashed var(--hairline);
      font-family: var(--ff-mono); font-size: 12px;
    }
    .vD__sheetKey { color: var(--ghost); text-transform: uppercase; letter-spacing: var(--tr-caps); font-size: 10px; }
    .vD__sheetVal { color: var(--bone); }
    .vD__photo {
      margin-top: 24px;
      aspect-ratio: 4 / 5;
      background:
        radial-gradient(ellipse at 50% 60%, rgba(0,240,200,0.04), transparent 50%),
        var(--space);
      border: 1px solid var(--hairline);
      position: relative;
    }
    .vD__photo::before {
      content: "[ portrait · 4:5 ]";
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--ff-mono); font-size: 10px;
      letter-spacing: var(--tr-caps); color: var(--ghost);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="env,react" src="project/design-canvas.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef, useMemo } = React;

    const WORKS = [
      { addr: "0x01", name: "Wafer",                tagline: "36-key ultrathin split keyboard",   year: "2025" },
      { addr: "0x02", name: "Kerfur",               tagline: "Embedded pet · event bus",          year: "2025 —" },
      { addr: "0x03", name: "ZMK PointAccel",       tagline: "Open-source input processor",       year: "2025" },
      { addr: "0x04", name: "Tactical Flashlight",  tagline: "For Energy for Ukraine",            year: "12/25" },
    ];

    function MiniCard({ w, i }) {
      return (
        <div className="miniCard">
          <div className="miniCard__chrome">
            <span className="miniCard__dot" />
            <span className="miniCard__addr">node {w.addr}</span>
            <span className="miniCard__sep" />
            <span className="miniCard__year">{w.year}</span>
            <span style={{ flex: 1 }} />
            <span>{(i + 1).toString().padStart(2,"0")} / 04</span>
          </div>
          <div className="miniCard__art">
            <div className="miniCard__corner miniCard__corner--tl" />
            <div className="miniCard__corner miniCard__corner--tr" />
            <div className="miniCard__corner miniCard__corner--bl" />
            <div className="miniCard__corner miniCard__corner--br" />
            <div className="miniCard__cross" />
          </div>
          <div className="miniCard__foot">
            <div>
              <h3 className="miniCard__name">{w.name}<em>.</em></h3>
              <div className="miniCard__sub">{w.tagline}</div>
            </div>
            <span className="miniCard__open">OPEN →</span>
          </div>
        </div>
      );
    }

    /* ============= A · LINEAR HORIZONTAL PAN ============= */
    function VarA() {
      const [idx, setIdx] = useState(0);
      const N = WORKS.length;
      const railShift = -(idx * (540 + 32));

      // Auto-advance for demo
      useEffect(() => {
        const id = setInterval(() => setIdx(i => (i + 1) % N), 1700);
        return () => clearInterval(id);
      }, []);

      return (
        <div className="vbox">
          <div className="vbox__head">
            <h2 className="vbox__title">Selected work<em>.</em></h2>
            <div className="vbox__meta">
              <div>A · LINEAR PAN</div>
              <div>RAIL TRANSLATES BY SCROLL · NO PERSPECTIVE</div>
            </div>
          </div>
          <div className="vA__stage">
            <div className="vA__rail" style={{ transform: `translateX(${railShift}px)` }}>
              {WORKS.map((w, i) => (
                <div className="vA__slot" key={w.addr}><MiniCard w={w} i={i} /></div>
              ))}
            </div>
          </div>
          <div className="vbox__spineRail">
            <div className="vbox__spineFill" style={{ width: `${((idx) / (N - 1)) * 100}%` }} />
          </div>
          <div className="vbox__spine">
            <span>SCROLL TO PAN · LINEAR</span>
            <span className="vbox__spineCount">{(idx + 1).toString().padStart(2,"0")} / 04</span>
          </div>
        </div>
      );
    }

    /* ============= B · CARD IN FOCUS — perspective, edges fade ============= */
    function VarB() {
      const [progress, setProgress] = useState(0); // 0..1 across N cards
      const N = WORKS.length;
      useEffect(() => {
        let t0 = performance.now();
        let raf;
        const loop = (now) => {
          const t = ((now - t0) / 7000) % 1;
          setProgress(t);
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(raf);
      }, []);

      const activeIdx = Math.round(progress * (N - 1));

      return (
        <div className="vbox">
          <div className="vbox__head">
            <h2 className="vbox__title">Selected work<em>.</em></h2>
            <div className="vbox__meta">
              <div>B · CARD-IN-FOCUS</div>
              <div>SLIDE IN · SCALE UP · EDGES DECAY</div>
            </div>
          </div>
          <div className="vB__stage">
            <div className="vB__deck">
              {WORKS.map((w, i) => {
                const slot = i / (N - 1);
                const d = progress - slot;
                const offset = d * 700;                      // px
                const absD = Math.min(1, Math.abs(d) * (N - 1));
                const scale = 0.78 + 0.26 * (1 - absD);
                const opacity = 0.18 + 0.82 * (1 - absD);
                const rot = -d * 18;
                return (
                  <div
                    className="vB__card"
                    key={w.addr}
                    style={{
                      transform: `translateX(${offset.toFixed(1)}px) perspective(1400px) rotateY(${rot.toFixed(2)}deg) scale(${scale.toFixed(3)})`,
                      opacity: opacity.toFixed(2),
                      zIndex: Math.round(100 - absD * 100),
                    }}
                  >
                    <MiniCard w={w} i={i} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="vbox__spineRail">
            <div className="vbox__spineFill" style={{ width: `${progress * 100}%` }} />
          </div>
          <div className="vbox__spine">
            <span>CARDS COMPETE FOR THE CENTER · CINEMATIC</span>
            <span className="vbox__spineCount">{(activeIdx + 1).toString().padStart(2,"0")} / 04</span>
          </div>
        </div>
      );
    }

    /* ============= C · FILMSTRIP DOLLY — rail moves, camera-lens framing ============= */
    function VarC() {
      const [progress, setProgress] = useState(0);
      const N = WORKS.length;
      useEffect(() => {
        let t0 = performance.now();
        let raf;
        const loop = (now) => {
          const t = ((now - t0) / 7000) % 1;
          setProgress(t);
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(raf);
      }, []);

      const slotW = 460 + 28;
      const totalShift = (N - 1) * slotW;
      const railX = -progress * totalShift;
      const bgX   = railX * 0.35;  // parallax

      const activeIdx = Math.round(progress * (N - 1));

      return (
        <div className="vbox">
          <div className="vbox__head">
            <h2 className="vbox__title">Selected work<em>.</em></h2>
            <div className="vbox__meta">
              <div>C · FILMSTRIP DOLLY</div>
              <div>STATIC LENS · RAIL + BG PARALLAX</div>
            </div>
          </div>
          <div className="vC__stage">
            <div className="vC__bg" style={{ transform: `translateX(${bgX.toFixed(1)}px)` }} />
            <div className="vC__rail" style={{ transform: `translate(${(railX + 110).toFixed(1)}px, -50%)` }}>
              {WORKS.map((w, i) => (
                <div className="vC__slot" key={w.addr}><MiniCard w={w} i={i} /></div>
              ))}
            </div>
            <div className="vC__lens" />
            <div className="vC__reticle">
              <span /><span /><span /><span />
            </div>
            <div className="vC__lock">● LOCK · {(activeIdx + 1).toString().padStart(2,"0")} · {WORKS[activeIdx].name.toUpperCase()}</div>
          </div>
          <div className="vbox__spineRail">
            <div className="vbox__spineFill" style={{ width: `${progress * 100}%` }} />
          </div>
          <div className="vbox__spine">
            <span>RAIL MOVES PAST A FIXED RETICLE · FILM</span>
            <span className="vbox__spineCount">{(activeIdx + 1).toString().padStart(2,"0")} / 04</span>
          </div>
        </div>
      );
    }

    /* ============= D · ABOUT · VERTICAL (legacy) ============= */
    function VarD() {
      return (
        <div className="vD">
          <header className="vD__head">
            <div className="vD__num">03</div>
            <h2 className="vD__title">About<em>.</em></h2>
            <div className="vD__meta">
              <div>D · VERTICAL · LEGACY</div>
              <div>18 · MUNICH · 2026</div>
            </div>
          </header>
          <div className="vD__grid">
            <div className="vD__col">
              <p>
                I'm Oleksandr — eighteen, born in Kyiv on 21 July 2007, now living in Munich.
                I make small electronic things from scratch — schematic, board, firmware, case —
                and I write the documentation that goes with them.
              </p>
              <p>
                I started with keyboards because I wanted one that fit my hands. I stayed because
                building one teaches you everything: PCB layout, power, BLE, real-time firmware,
                tooling, code review, and patience. The Wafer is the third revision.
              </p>
              <p>
                I learn fastest in the open. Most of my work is on GitHub. I contribute upstream
                when I can, and maintain a few small modules others use. I write in English and
                German; my school transcript is 12/12 in CS, Physics, Chemistry, English.
              </p>
              <div className="vD__photo" />
            </div>
            <aside className="vD__sheet">
              <div className="vD__sheetHead">
                <span>■ DATASHEET</span>
                <span>v0.1 · STATIC</span>
              </div>
              {[
                ["born", "21.07.2007 · Kyiv, UA"],
                ["based", "Munich, DE"],
                ["language", "EN · DE B2 · UA · RU"],
                ["seeking", "Ausbildung · embedded"],
                ["years", "5"],
                ["github", "@oleksandrmaslov"],
                ["email", "oleksandrmaslov08@gmail.com"],
                ["phone", "+49 172 3416265"],
              ].map(([k, v]) => (
                <div key={k} className="vD__sheetRow">
                  <span className="vD__sheetKey">{k}</span>
                  <span className="vD__sheetVal">{v}</span>
                </div>
              ))}
            </aside>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="work-mechanics" title="Selected work · scroll mechanic">
            <DCArtboard id="vA" label="A — linear horizontal pan (current commit)" width={1440} height={900}>
              <VarA />
            </DCArtboard>
            <DCArtboard id="vB" label="B — card-in-focus · cinematic" width={1440} height={900}>
              <VarB />
            </DCArtboard>
            <DCArtboard id="vC" label="C — filmstrip dolly · static lens" width={1440} height={900}>
              <VarC />
            </DCArtboard>
          </DCSection>

          <DCSection id="about-mechanics" title="About · layout option">
            <DCArtboard id="vD" label="D — vertical (legacy · keep as variant)" width={1440} height={900}>
              <VarD />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
