<body>
  <div id="root"></div>

  <!-- Three.js (ESM) exposed on window.THREE for the Babel scripts below -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    window.THREE = Object.assign({}, THREE, { GLTFLoader, MeshoptDecoder, RoomEnvironment, RoundedBoxGeometry });
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared system (FibGrid, Boot, Cursor) -->
  <script type="text/babel" data-presets="env,react" src="system/core.jsx"></script>

  <!-- ASCII photo reveal-lens (lab engine + React figure wrapper) -->
  <script src="lab/ascii-photo/ascii-photo.js"></script>

  <!-- Project pieces (no demo scripts — this node links to the portfolio itself) -->
  <script type="text/babel" data-presets="env,react" src="project/data.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project/viewer3d.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project_v2/hero-rig.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project_v2/tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="lab/ascii-photo/ascii-figure.jsx"></script>

  <!-- Page config -->
  <script type="text/babel" data-presets="env,react">
    window.PAGE_CONFIG = {
      addr: "0x07",
      docTitle: "M.O. System — Maslov Oleksandr",
      hero: {
        /* the architecture made physical: the system as a stack of hairline
           plates — tokens / page core / hero rig / demo engine / field —
           drifting apart, threaded by a signal spine, one plate pulsing. */
        matcap: false,
        modelFit: 3.7,
        pose: { x: 0.5, y: -0.55, z: 0.12 },
        buildModel: (THREE) => {
          const g = new THREE.Group();
          const Rounded = THREE.RoundedBoxGeometry;
          const LAYERS = [
            { z:  0.62, c: 0x2b3442, label: "SYSTEM" },
            { z:  0.31, c: 0x243043, label: "PAGE CORE" },
            { z:  0.00, c: 0x1f3a44, label: "HERO RIG" },
            { z: -0.31, c: 0x243043, label: "DEMO ENGINE" },
            { z: -0.62, c: 0x2b3442, label: "FIELD" },
          ];
          const plates = [];
          LAYERS.forEach((L, i) => {
            const geo = Rounded ? new Rounded(2.0, 1.3, 0.04, 4, 0.05)
                                : new THREE.BoxGeometry(2.0, 1.3, 0.04);
            const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
              color: L.c, metalness: 0.4, roughness: 0.5,
              transparent: true, opacity: 0.92,
            }));
            m.position.z = L.z;
            /* hairline edge frame */
            const edges = new THREE.LineSegments(
              new THREE.EdgesGeometry(geo),
              new THREE.LineBasicMaterial({ color: 0x00f0c8, transparent: true, opacity: 0.32 })
            );
            edges.position.copy(m.position);
            /* a small signal node on each plate (the "one node" motif) */
            const dot = new THREE.Mesh(
              new THREE.SphereGeometry(0.05, 14, 12),
              new THREE.MeshStandardMaterial({ color: 0x00f0c8, emissive: 0x00f0c8, emissiveIntensity: 0.7 })
            );
            dot.position.set(-0.78, 0.42, L.z + 0.03);
            g.add(m, edges, dot);
            plates.push({ m, edges, dot, baseZ: L.z, i });
          });

          /* the spine threading all layers */
          const spine = new THREE.Mesh(
            new THREE.CylinderGeometry(0.014, 0.014, 1.5, 8),
            new THREE.MeshBasicMaterial({ color: 0x00f0c8, transparent: true, opacity: 0.4 })
          );
          spine.rotation.x = Math.PI / 2;
          spine.position.set(-0.78, 0.42, 0);
          g.add(spine);

          /* a pulse travelling the spine */
          const pulse = new THREE.PointLight(0x00f0c8, 1.0, 2.2);
          g.add(pulse);

          let t0 = performance.now();
          const tick = (now) => {
            const t = (now - t0) / 1000;
            plates.forEach((p) => {
              /* gentle breathing separation + the active-plate glow sweep */
              const sep = 1 + Math.sin(t * 0.5 + p.i * 0.6) * 0.06;
              const z = p.baseZ * sep;
              p.m.position.z = z; p.edges.position.z = z; p.dot.position.z = z + 0.03;
              const active = (Math.floor(t * 0.7) % plates.length) === p.i;
              p.edges.material.opacity = active ? 0.85 : 0.3;
              p.dot.material.emissiveIntensity = active ? 1.4 : 0.55;
            });
            const pz = Math.sin(t * 1.4) * 0.62;
            pulse.position.set(-0.78, 0.42, pz);
            if (!window.__hv_leaving) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
          return g;
        },
      },
      link: { label: "OPEN THE PORTFOLIO", href: "Landing v11.html", hint: "THIS PAGE · IS · A NODE", self: true },
      tweakDefaults: /*EDITMODE-BEGIN*/{}/*EDITMODE-END*/,
      renderTweaks: () => null,
    };
  </script>

  <!-- Page core (generalized v2 template) -->
  <script type="text/babel" data-presets="env,react" src="project_v2/page-core.jsx"></script>

  <!-- ASCII RAMP scrollbar (shared w/ Landing v11) -->
  <script src="landing_v11/landing-scrollbar.js"></script>
</body>
</html>
