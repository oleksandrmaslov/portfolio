<body>
  <div id="root"></div>

  <!-- SEAM BRIDGE: if we arrived from the landing flight, paint the captured
       final frame instantly so the model never disappears during boot. -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem("mo_node_arrive") !== "1" || sessionStorage.getItem("mo_node_addr") !== "0x01") return;
        var img = sessionStorage.getItem("mo_node_seam");
        if (!img) return;
        var d = document.createElement("div");
        d.id = "mo-seam";
        d.style.cssText = "position:fixed;inset:0;z-index:60;background:#04060d center center / cover no-repeat;transition:opacity .55s cubic-bezier(0.16,1,0.3,1);pointer-events:none;";
        d.style.backgroundImage = "url(" + img + ")";
        d.appendChild(Object.assign(document.createElement("div"), {
          className: "mo-seam__tag",
          textContent: "WAFER"
        }));
        document.body.appendChild(d);
      } catch (e) {}
    })();
  </script>

  <!-- Three.js (ESM) + GLTFLoader + MeshoptDecoder + RoomEnvironment, exposed
       on window.THREE for the non-module Babel-standalone scripts below. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
    window.THREE = Object.assign({}, THREE, { GLTFLoader, MeshoptDecoder, RoomEnvironment, RoundedBoxGeometry, KTX2Loader });
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared system (FibGrid, Boot, Cursor) -->
  <script type="text/babel" data-presets="env,react" src="system/core.jsx"></script>

  <!-- KeyButton (inline; shared with Landing) -->
  <script type="text/babel" data-presets="env,react">
    function KeyButton({ children, legend = "↵", primary, onPress }) {
      const { useState } = React;
      const [pressed, setPressed] = useState(false);
      const [lit, setLit] = useState(false);
      const fire = (el) => {
        setPressed(true); setLit(true);
        onPress && onPress();
        if (el && el.blur) el.blur();
        setTimeout(() => setPressed(false), 140);
        setTimeout(() => setLit(false), 520);
      };
      const onKey = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fire(e.currentTarget); } };
      return (
        <button
          className={"key " + (pressed ? "key--down " : "") + (lit ? "key--lit " : "") + (primary ? "key--primary" : "")}
          onClick={(e) => fire(e.currentTarget)} onKeyDown={onKey}>
          <span className="key__cap">
            <span className="key__legendTop">{legend}</span>
            <span className="key__label">{children}</span>
          </span>
          <span className="key__shadow" aria-hidden="true" />
        </button>
      );
    }
    window.KeyButton = KeyButton;
  </script>
