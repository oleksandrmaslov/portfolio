<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iskra v3 — 3D Flashing Line · Maslov Oleksandr</title>
  <meta name="description" content="ИСКРA · Line Shift · 3D bench — inspect a procedurally-built PCB in 3D, read the worn silkscreen, match the firmware and flash it. A correct flash assembles the finished product. Energy for Ukraine volunteer flashing station." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" />

  <link rel="stylesheet" href="system/tokens.css" />
  <link rel="stylesheet" href="system/layout.css" />
  <link rel="stylesheet" href="system/extras.css" />
  <link rel="stylesheet" href="demo/demo.css" />
  <link rel="stylesheet" href="demo/demo2.css" />
  <link rel="stylesheet" href="demo/iskra.css" />
  <link rel="stylesheet" href="demo3d/iskra3d.css" />

  <style>
    html, body { margin: 0; height: 100%; background: var(--void, #04060a); overflow: hidden; }
    #root { position: fixed; inset: 0; }
    /* this demo boots straight into the active overlay */
    .hvd--iskra3d.hvd--boot .hvd__stage--flat,
    .hvd--iskra3d .hvd__stage--flat { cursor: default; }

    /* paused splash */
    .i3-resume { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(4,6,10,0.86); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: hvdFadeIn 300ms var(--e-out) both; }
    .i3-resume__card { display: flex; flex-direction: column; align-items: center; gap: var(--s-5); padding: var(--s-8); border: 1px solid var(--hairline); background: rgba(8,12,20,0.92); }
    .i3-resume__t { font-family: var(--ff-mono); font-size: 13px; letter-spacing: 0.12em; color: var(--bone); text-transform: uppercase; }
    .i3-resume__s { font-family: var(--ff-mono); font-size: 10px; letter-spacing: var(--tr-caps); text-transform: uppercase; color: var(--ghost); }
    .i3-resume__btn { display: inline-flex; align-items: center; gap: var(--s-4); padding: var(--s-5) var(--s-7); background: var(--isk-blue, #2a8fff); border: 1px solid var(--isk-blue, #2a8fff); color: #02060e; font-family: var(--ff-mono); font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: filter var(--d-fast); }
    .i3-resume__btn:hover { filter: brightness(1.12); }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- bundler splash (used only if exported to a standalone file) -->
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#0a1322"/>
      <rect x="30" y="30" width="40" height="40" rx="3" fill="#0c3a24" stroke="#1d6b46"/>
      <rect x="44" y="44" width="12" height="12" fill="#14171c"/>
      <path d="M50 12 L56 24 L50 20 L44 24 Z" fill="#2a8fff"/>
      <path d="M50 88 L44 76 L50 80 L56 76 Z" fill="#ffe500"/>
    </svg>
  </template>

  <!-- Three.js (ESM) exposed on window.THREE -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    window.THREE = Object.assign({}, THREE, { GLTFLoader, MeshoptDecoder, RoomEnvironment, RoundedBoxGeometry });
    window.dispatchEvent(new Event("three-ready"));
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- sound: carrier field + iskra spark/relay palette -->
  <script src="demo/field-core.js"></script>
  <script src="demo/iskra-sound.js"></script>

  <!-- 3D PCB engine: parts → factory → board build → enclosures → station -->
  <script src="demo3d/pcb-parts.js"></script>
  <script src="demo3d/pcb-factory.js"></script>
  <script src="demo3d/pcb-build.js"></script>
  <script src="demo3d/enclosures.js"></script>
  <script src="demo3d/iskra3d-station.js"></script>

  <!-- React UI: tweaks shell · 3D stage · HUD -->
  <script type="text/babel" data-presets="env,react" src="demo3d/tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="demo3d/pcb-stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="demo3d/iskra3d-hud.jsx"></script>

  <!-- boot -->
  <script type="text/babel" data-presets="env,react">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "wear": 1.0,
      "idleSpin": false,
      "grid": true,
      "soundLevel": 0.8
    }/*EDITMODE-END*/;

    function ResumeSplash({ onResume }) {
      return (
        <div className="i3-resume">
          <div className="i3-resume__card">
            <span className="isk-spark" aria-hidden="true"><i /></span>
            <div className="i3-resume__t">SHIFT PAUSED</div>
            <div className="i3-resume__s">the bench is idle — clock back on to run a new shift</div>
            <button className="i3-resume__btn" onClick={onResume}><span>▸</span> RESUME</button>
          </div>
        </div>
      );
    }

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [running, setRunning] = React.useState(true);
      const tweaks = { wear: t.wear, idleSpin: t.idleSpin, grid: t.grid, soundLevel: t.soundLevel };

      return (
        <>
          <Iskra3DDemoLayer active={running} onClose={() => setRunning(false)} tweaks={tweaks} />
          {!running && <ResumeSplash onResume={() => setRunning(true)} />}

          <TweaksPanel title="Tweaks">
            <TweakSection label="Difficulty" />
            <TweakSlider label="Silkscreen wear" value={t.wear} min={0.4} max={1.5} step={0.05}
                         onChange={(v) => setTweak("wear", v)} />
            <TweakSection label="Bench" />
            <TweakToggle label="Idle auto-rotate" value={t.idleSpin}
                         onChange={(v) => setTweak("idleSpin", v)} />
            <TweakToggle label="Lab grid" value={t.grid}
                         onChange={(v) => setTweak("grid", v)} />
            <TweakSection label="Sound" />
            <TweakSlider label="Field level" value={t.soundLevel} min={0} max={1} step={0.05}
                         onChange={(v) => setTweak("soundLevel", v)} />
          </TweaksPanel>
        </>
      );
    }

    function mount() {
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    }
    if (window.THREE) mount();
    else window.addEventListener("three-ready", mount, { once: true });
  </script>
</body>
</html>
