  <style>
html.mo-pl-on{overflow:hidden}
#mo-pl{position:fixed;inset:0;z-index:120;background:#05060a;transition:opacity 300ms linear;font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
#mo-pl.is-out{opacity:0}
#mo-pl.is-hand{background:transparent}
#mo-pl .mo-pl__seed{position:absolute;inset:0;opacity:.55;transition:opacity 700ms linear;filter:blur(1.4px);background:radial-gradient(1.6px 1.6px at 18% 26%,rgba(226,232,240,.5),transparent 60%),radial-gradient(1.8px 1.8px at 71% 14%,rgba(226,232,240,.42),transparent 60%),radial-gradient(1.4px 1.4px at 44% 63%,rgba(226,232,240,.46),transparent 60%),radial-gradient(2px 2px at 86% 71%,rgba(226,232,240,.34),transparent 60%),radial-gradient(1.5px 1.5px at 29% 84%,rgba(226,232,240,.4),transparent 60%),radial-gradient(1.7px 1.7px at 61% 41%,rgba(226,232,240,.3),transparent 60%)}
#mo-pl.is-live .mo-pl__seed{opacity:0}
#mo-pl .mo-pl__cv{position:absolute;inset:0;display:block;transition:opacity 560ms linear}
#mo-pl.is-hand .mo-pl__cv{opacity:0}
#mo-pl .mo-pl__ret{position:absolute;inset:34px;pointer-events:none}
#mo-pl .mo-pl__c{position:absolute;width:15px;height:15px}
#mo-pl .mo-pl__c::before,#mo-pl .mo-pl__c::after{content:"";position:absolute;background:#00f0c8;opacity:.85}
#mo-pl .mo-pl__c::before{width:15px;height:1px}
#mo-pl .mo-pl__c::after{width:1px;height:15px}
#mo-pl .mo-pl__c--tl{top:0;left:0}#mo-pl .mo-pl__c--tl::before,#mo-pl .mo-pl__c--tl::after{top:0;left:0}
#mo-pl .mo-pl__c--tr{top:0;right:0}#mo-pl .mo-pl__c--tr::before,#mo-pl .mo-pl__c--tr::after{top:0;right:0}
#mo-pl .mo-pl__c--bl{bottom:0;left:0}#mo-pl .mo-pl__c--bl::before,#mo-pl .mo-pl__c--bl::after{bottom:0;left:0}
#mo-pl .mo-pl__c--br{bottom:0;right:0}#mo-pl .mo-pl__c--br::before,#mo-pl .mo-pl__c--br::after{bottom:0;right:0}
#mo-pl .mo-pl__read{position:absolute;left:34px;bottom:24px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#mo-pl .mo-pl__hex{display:flex;align-items:baseline;font-weight:600;line-height:.82;letter-spacing:-.025em;font-variant-numeric:tabular-nums;font-size:clamp(66px,10vw,158px);color:#e2e8f0}
#mo-pl .mo-pl__pre{font-size:.34em;letter-spacing:.1em;color:#00f0c8;opacity:.8;margin-right:.24em;transform:translateY(-.9em)}
#mo-pl .mo-pl__bar{position:relative;width:min(46vw,420px);height:1px;background:rgba(226,232,240,.12);overflow:hidden}
#mo-pl .mo-pl__bar i{position:absolute;inset:0;background:#00f0c8;transform-origin:0 50%;transform:scaleX(0)}
#mo-pl .mo-pl__pct{font-size:10px;letter-spacing:.16em;color:rgba(226,232,240,.4)}
@media (max-width:700px){#mo-pl .mo-pl__ret{inset:18px}#mo-pl .mo-pl__read{left:18px;bottom:18px}#mo-pl .mo-pl__bar{width:64vw}}

  <script type="text/babel" data-presets="env,react">
    function KeyButton({ children, legend = "↵", primary, onPress }) {
      const { useState } = React;
      const [pressed, setPressed] = useState(false);
      const [lit, setLit] = useState(false);
      const fire = (e) => {
        setPressed(true);
        setLit(true);
        if (window.MOSound) { window.MOSound.unlock(); window.MOSound.thock({ vel: 0.85 }); }
        if (window.__mo_disturb && e && e.currentTarget && e.currentTarget.getBoundingClientRect) {
          const r = e.currentTarget.getBoundingClientRect();
          window.__mo_disturb(r.left + r.width / 2, r.top + r.height / 2, 0.8);
        }
        onPress && onPress();
        setTimeout(() => { setPressed(false); if (window.MOSound) window.MOSound.thockUp(); }, 140);
        setTimeout(() => setLit(false), 520);
      };
      const onKey = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fire(); } };
      return (
        <button
          className={"key " + (pressed ? "key--down " : "") + (lit ? "key--lit " : "") + (primary ? "key--primary" : "")}
          onClick={fire}
          onKeyDown={onKey}
        >
          <span className="key__cap">
            <span className="key__legendTop">{legend}</span>
            <span className="key__label">{children}</span>
          </span>
          <span className="key__shadow" aria-hidden="true" />
        </button>
      );
    }
    window.KeyButton = KeyButton;
  </script>
