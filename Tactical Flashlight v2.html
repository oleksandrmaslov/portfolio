<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tactical Flashlight — Maslov Oleksandr</title>
  <meta name="description" content="Tactical Flashlight · project case file · Maslov Oleksandr · volunteer firmware · PY32F002A · Energy for Ukraine." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />

  <link rel="stylesheet" href="system/tokens.css" />
  <link rel="stylesheet" href="system/layout.css" />
  <link rel="stylesheet" href="system/extras.css" />
  <link rel="stylesheet" href="project/page.css" />
  <link rel="stylesheet" href="project_v2/page2.css" />
  <link rel="stylesheet" href="demo/demo.css" />
  <link rel="stylesheet" href="demo/demo2.css" />
  <link rel="stylesheet" href="lab/ascii-photo/ascii-figure.css" />
  <link rel="stylesheet" href="system/cursor.css" />
  <link rel="stylesheet" href="system/scrollbar.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Three.js (ESM) + GLTFLoader + MeshoptDecoder + RoomEnvironment, exposed
       on window.THREE for the non-module Babel-standalone scripts below. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    window.THREE = Object.assign({}, THREE, { GLTFLoader, MeshoptDecoder, RoomEnvironment, RoundedBoxGeometry });
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared system (FibGrid, Boot, Cursor) -->
  <script type="text/babel" data-presets="env,react" src="system/core.jsx"></script>

  <!-- PLAY DEMO · field sound core + torch palette + procedural torch + controller -->
  <script src="demo/field-core.js"></script>
  <script src="demo/torch-sound.js"></script>
  <script src="demo/torch-model.js"></script>
  <script src="demo/torch-demo.js"></script>

  <!-- ASCII photo reveal-lens (lab engine + React figure wrapper) -->
  <script src="lab/ascii-photo/ascii-photo.js"></script>

  <!-- Project pieces -->
  <script type="text/babel" data-presets="env,react" src="project/data.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project/viewer3d.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project_v2/hero-rig.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project_v2/tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="lab/ascii-photo/ascii-figure.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="demo/torch-hud.jsx"></script>

  <!-- Page config — everything project-specific lives here -->
  <script type="text/babel" data-presets="env,react">
    window.PAGE_CONFIG = {
      addr: "0x04",
      docTitle: "Tactical Flashlight — Maslov Oleksandr",
      hero: {
        model: "models/tactical_flashlight.glb",
        pose: { x: 0.5, y: 0.35, z: -0.5 },   // lies at a ready angle, head toward camera
      },
      demo: {
        layerName: "TorchDemoLayer",
        hint: "SW1 · SW2 · SOS · BATT",
        label: "PLAY DEMO",
      },
      tweakDefaults: /*EDITMODE-BEGIN*/{
        "direction": "cinematic",
        "hud": "full",
        "clickPitch": 1,
        "soundLevel": 0.8,
        "drainSpeed": 1
      }/*EDITMODE-END*/,
      renderTweaks: (t, set) => (
        <>
          <TweakSection label="Demo" />
          <TweakRadio label="Direction" value={t.direction}
                      options={["cinematic", "sandbox"]}
                      onChange={(v) => set("direction", v)} />
          <TweakRadio label="HUD density" value={t.hud}
                      options={["full", "minimal"]}
                      onChange={(v) => set("hud", v)} />
          <TweakSection label="Firmware sim" />
          <TweakSlider label="Drain speed" value={t.drainSpeed} min={0.25} max={4} step={0.25}
                       onChange={(v) => set("drainSpeed", v)} />
          <TweakSection label="Sound" />
          <TweakSlider label="Click pitch" value={t.clickPitch} min={0.7} max={1.3} step={0.05}
                       onChange={(v) => set("clickPitch", v)} />
          <TweakSlider label="Field level" value={t.soundLevel} min={0} max={1} step={0.05}
                       onChange={(v) => set("soundLevel", v)} />
        </>
      ),
    };
  </script>

  <!-- Page core (generalized v2 template) -->
  <script src="system/cursor-distortion.js"></script>
  <script type="text/babel" data-presets="env,react" src="project_v2/page-core.jsx"></script>

  <!-- ASCII RAMP scrollbar (shared w/ Landing v11) -->
  <script src="landing_v11/landing-scrollbar.js"></script>
</body>
</html>
