</head>
<body>
  <div id="root"></div>

  <!-- Three.js (ESM) exposed on window.THREE for the Babel scripts below -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    window.THREE = Object.assign({}, THREE, { GLTFLoader, MeshoptDecoder, RoomEnvironment });
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared system (FibGrid, Boot, Cursor) -->
  <script type="text/babel" data-presets="env,react" src="system/core.jsx"></script>

  <!-- PLAY DEMO · field core + glide-grain palette + firmware-port controller -->
  <script src="demo/field-core.js"></script>
  <script src="demo/accel-sound.js"></script>
  <script src="demo/accel-demo.js"></script>

  <!-- ASCII photo reveal-lens (lab engine + React figure wrapper) -->
  <script src="lab/ascii-photo/ascii-photo.js"></script>

  <!-- Project pieces -->
  <script type="text/babel" data-presets="env,react" src="project/data.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project/viewer3d.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project_v2/hero-rig.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project_v2/tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="lab/ascii-photo/ascii-figure.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="demo/accel-hud.jsx"></script>

  <!-- Page config — everything project-specific lives here -->
  <script type="text/babel" data-presets="env,react">
    window.PAGE_CONFIG = {
      addr: "0x03",
      docTitle: "ZMK PointAccel — Maslov Oleksandr",
      hero: {
        /* the acceleration curve made physical: a glowing ribbon over a
           hairline plate, with a puck that travels it at curve speed —
           slow and precise at the bottom, ×3.5 at the top */
        matcap: false,
        modelFit: 3.6,
        pose: { x: 0.18, y: -0.5, z: 0 },
        buildModel: (THREE) => {
          const g = new THREE.Group();

          /* plate + grid */
          const plate = new THREE.Mesh(
            new THREE.BoxGeometry(3.0, 0.05, 1.9),
            new THREE.MeshStandardMaterial({ color: 0x10151f, metalness: 0.6, roughness: 0.4 })
          );
          plate.position.y = -0.65;
          g.add(plate);
          const grid = new THREE.GridHelper(2.8, 14, 0x223044, 0x1a2433);
          grid.position.y = -0.62;
          g.add(grid);

          /* the curve: factor(speed), HEAVY-ish expo for drama */
          const f = (t) => {
            const v1 = 0.18, v2 = 0.85;
            if (t <= v1) return 0;
            if (t >= v2) return 1;
            const u = (t - v1) / (v2 - v1);
            return u * u;
          };
          const pts = [];
          for (let i = 0; i <= 60; i++) {
            const t = i / 60;
            pts.push(new THREE.Vector3(-1.3 + t * 2.6, -0.6 + f(t) * 1.25, 0));
          }
          const path = new THREE.CatmullRomCurve3(pts);
          const ribbon = new THREE.Mesh(
            new THREE.TubeGeometry(path, 90, 0.028, 10, false),
            new THREE.MeshStandardMaterial({
              color: 0x0a2a26, metalness: 0.3, roughness: 0.3,
              emissive: 0x00f0c8, emissiveIntensity: 0.85,
            })
          );
          g.add(ribbon);

          /* threshold + vmax hairline posts */
          [0.18, 0.85].forEach((t) => {
            const post = new THREE.Mesh(
              new THREE.BoxGeometry(0.012, 1.5, 0.012),
              new THREE.MeshBasicMaterial({ color: 0x2a3a50 })
            );
            post.position.set(-1.3 + t * 2.6, 0.1, 0);
            g.add(post);
          });

          /* the puck: travels the curve, fast where the factor is high */
          const puck = new THREE.Mesh(
            new THREE.SphereGeometry(0.075, 18, 14),
            new THREE.MeshStandardMaterial({
              color: 0xe8e4da, metalness: 0.2, roughness: 0.25,
              emissive: 0xbfeaff, emissiveIntensity: 0.5,
            })
          );
          g.add(puck);
          const halo = new THREE.PointLight(0x00f0c8, 0.9, 2.2);
          g.add(halo);

          let u = 0, last = performance.now();
          const tick = (now) => {
            const dt = Math.min(50, now - last); last = now;
            u += dt * 0.00009 * (0.35 + f(u) * 2.6);   // the curve drives its own speed
            if (u > 1) u = 0;
            const p = path.getPointAt(Math.min(u, 1));
            puck.position.copy(p).add(new THREE.Vector3(0, 0.1, 0));
            halo.position.copy(puck.position);
            if (!window.__hv_leaving) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);

          return g;
        },
      },
      demo: {
        layerName: "AccelDemoLayer",
        hint: "YOUR CURSOR · THE CURVE · DT EMIT",
        label: "PLAY DEMO",
      },
      tweakDefaults: /*EDITMODE-BEGIN*/{
        "direction": "cinematic",
        "hud": "full",
        "soundLevel": 0.8,
        "cpiScale": 2
      }/*EDITMODE-END*/,
      renderTweaks: (t, set) => (
        <>
          <TweakSection label="Demo" />
          <TweakRadio label="Direction" value={t.direction}
                      options={["cinematic", "sandbox"]}
                      onChange={(v) => set("direction", v)} />
          <TweakRadio label="HUD density" value={t.hud}
                      options={["full", "minimal"]}
                      onChange={(v) => set("hud", v)} />
          <TweakSection label="Input sim" />
          <TweakSlider label="CPI scale" value={t.cpiScale} min={1} max={4} step={0.5}
                       onChange={(v) => set("cpiScale", v)} />
          <TweakSection label="Sound" />
          <TweakSlider label="Field level" value={t.soundLevel} min={0} max={1} step={0.05}
                       onChange={(v) => set("soundLevel", v)} />
        </>
      ),
    };
  </script>

  <!-- Page core (generalized v2 template) -->
  <script type="text/babel" data-presets="env,react" src="project_v2/page-core.jsx"></script>

  <!-- ASCII RAMP scrollbar (shared w/ Landing v11) -->
  <script src="landing_v11/landing-scrollbar.js"></script>
