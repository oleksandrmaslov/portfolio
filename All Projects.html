  <!-- KeyButton — reused from landing -->
  <script type="text/plain" data-page-runtime-source="all-projects-key-button">
    function KeyButton({ children, legend = "↵", primary, onPress }) {
      const { useState } = React;
      const [pressed, setPressed] = useState(false);
      const [lit, setLit] = useState(false);
      const fire = () => {
        setPressed(true); setLit(true);
        onPress && onPress();
        setTimeout(() => setPressed(false), 140);
        setTimeout(() => setLit(false), 520);
      };
      const onKey = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fire(); } };
      return (
        <button
          className={"key " + (pressed ? "key--down " : "") + (lit ? "key--lit " : "") + (primary ? "key--primary" : "")}
          onClick={fire} onKeyDown={onKey}
        >
          <span className="key__cap">
            <span className="key__legendTop">{legend}</span>
            <span className="key__label">{children}</span>
          </span>
          <span className="key__shadow" aria-hidden="true" />
        </button>
      );
    }
    window.KeyButton = KeyButton;
  </script>

  <!-- The node dataset — SINGLE SOURCE OF TRUTH, shared with the landing -->
  <script src="app/data/projects.js?v=769387971478"></script>
  <script>
    /* Adapt MO_PROJECTS into the manifest row shape. The manifest is a table,
       so it only needs the text columns — no models, no poses. */
    window.UNIVERSE_PROJECTS = (window.MO_PROJECTS || []).map(function (p) {
      return {
        addr: p.addr, kind: p.slug, file: p.file, name: p.name,
        sub: p.short || p.statement,
        year: p.state || "",
        nodeClass: p.nodeClass || "",
        stack: (p.tags || []).join(" · ").toUpperCase(),
        mo: p,
      };
    });
    if (!window.UNIVERSE_PROJECTS.length) console.warn("[manifest] MO_PROJECTS missing");
  </script>
