  <script>
    /* Adapt MO_PROJECTS into the manifest row shape. The manifest is a table,
       so it only needs the text columns — no models, no poses. */
    window.UNIVERSE_PROJECTS = (window.MO_PROJECTS || []).map(function (p) {
      return {
        addr: p.addr, file: p.file, name: p.name,
        sub: p.short || p.statement,
        year: p.state || "",
        stack: (p.tags || []).join(" · ").toUpperCase(),
      };
    });
    if (!window.UNIVERSE_PROJECTS.length) console.warn("[manifest] MO_PROJECTS missing");
  </script>
