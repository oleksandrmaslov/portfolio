  <!-- SEAM BRIDGE: if we arrived from the landing flight, paint the captured
       final frame instantly so the model never disappears during boot. -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem("mo_node_arrive") !== "1" || sessionStorage.getItem("mo_node_addr") !== "0x01") return;
        var img = sessionStorage.getItem("mo_node_seam");
        if (!img) return;
        var d = document.createElement("div");
        d.id = "mo-seam";
        d.style.cssText = "position:fixed;inset:0;z-index:60;background:#04060d center center / cover no-repeat;transition:opacity .55s cubic-bezier(0.16,1,0.3,1);pointer-events:none;";
        d.style.backgroundImage = "url(" + img + ")";
        d.appendChild(Object.assign(document.createElement("div"), {
          className: "mo-seam__tag",
          textContent: "WAFER"
        }));
        document.body.appendChild(d);
      } catch (e) {}
    })();
  </script>

  <!-- KeyButton (inline; shared with Landing) -->
  <script type="text/plain" data-page-runtime-source="wafer-key-button">
    function KeyButton({ children, legend = "↵", primary, onPress }) {
      const { useState } = React;
      const [pressed, setPressed] = useState(false);
      const [lit, setLit] = useState(false);
      const fire = (el) => {
        setPressed(true); setLit(true);
        onPress && onPress();
        if (el && el.blur) el.blur();
        setTimeout(() => setPressed(false), 140);
        setTimeout(() => setLit(false), 520);
      };
      const onKey = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fire(e.currentTarget); } };
      return (
        <button
          className={"key " + (pressed ? "key--down " : "") + (lit ? "key--lit " : "") + (primary ? "key--primary" : "")}
          onClick={(e) => fire(e.currentTarget)} onKeyDown={onKey}>
          <span className="key__cap">
            <span className="key__legendTop">{legend}</span>
            <span className="key__label">{children}</span>
          </span>
          <span className="key__shadow" aria-hidden="true" />
        </button>
      );
    }
    window.KeyButton = KeyButton;
  </script>
