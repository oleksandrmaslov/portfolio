<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASCII Photo Lab — M.O. System</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />
<link rel="stylesheet" href="../../system/tokens.css" />

<style>
  html, body { height: 100%; overflow: hidden; }
  html.custom-cursor, html.custom-cursor * { cursor: none !important; }

  .lab {
    position: fixed; inset: 0;
    display: grid;
    grid-template-columns: 1fr 340px;
    background: var(--void);
  }

  /* ---------------- STAGE ---------------- */
  .stage {
    position: relative;
    overflow: hidden;
    border-right: 1px solid var(--hairline);
  }
  .stage__canvas { display: block; width: 100%; height: 100%; }

  /* corner ticks framing the stage — instrument viewport */
  .stage__frame { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  .stage__frame::before, .stage__frame::after,
  .stage__tick { position: absolute; width: 14px; height: 14px; border: 1px solid var(--ghost); opacity: 0.5; }
  .stage__frame::before { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
  .stage__frame::after  { top: 14px; right: 14px; border-left: 0; border-bottom: 0; }
  .stage__tick.bl { bottom: 14px; left: 14px; border-right: 0; border-top: 0; }
  .stage__tick.br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }

  .stage__hud {
    position: absolute; top: 22px; left: 26px; z-index: 5;
    font-family: var(--ff-mono); font-size: 11px; letter-spacing: 0.08em;
    color: var(--ghost); text-transform: uppercase; pointer-events: none;
    line-height: 1.7;
  }
  .stage__hud b { color: var(--bone); font-weight: 500; }
  .stage__hud .sig { color: var(--signal); }
  .stage__hud .row { display: flex; gap: 8px; }
  .stage__hud .k { color: var(--shadow); width: 58px; }

  .stage__readout {
    position: absolute; bottom: 22px; left: 26px; z-index: 5;
    font-family: var(--ff-mono); font-size: 11px; letter-spacing: 0.06em;
    color: var(--ghost); pointer-events: none; display: flex; gap: 18px; align-items: center;
  }
  .stage__readout .fps { color: var(--signal); }
  .stage__readout .dot { width: 5px; height: 5px; background: var(--signal); display: inline-block; margin-right: 6px; box-shadow: 0 0 8px var(--signal); }
  .stage__readout .hint { color: var(--shadow); text-transform: uppercase; }
  .stage__readout kbd {
    font-family: var(--ff-mono); font-size: 10px; color: var(--bone);
    border: 1px solid var(--hairline); border-radius: 3px; padding: 1px 5px; background: var(--carbon);
  }

  .stage__drop {
    position: absolute; inset: 0; z-index: 6; display: none;
    align-items: center; justify-content: center;
    background: rgba(4,6,13,0.78); backdrop-filter: blur(2px);
    font-family: var(--ff-mono); font-size: 13px; letter-spacing: 0.1em;
    color: var(--signal); text-transform: uppercase;
    border: 1.5px dashed var(--signal-dim); margin: 14px;
  }
  .stage.dragover .stage__drop { display: flex; }

  /* ---------------- PANEL ---------------- */
  .panel {
    background: var(--carbon);
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column;
  }
  .panel__head {
    position: sticky; top: 0; z-index: 2;
    padding: 18px 20px 14px;
    background: linear-gradient(var(--carbon), var(--carbon) 70%, transparent);
    border-bottom: 1px solid var(--hairline);
  }
  .panel__title { font-family: var(--ff-mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bone); font-weight: 600; }
  .panel__sub   { font-family: var(--ff-mono); font-size: 10.5px; letter-spacing: 0.06em; color: var(--ghost); margin-top: 4px; }
  .panel__sub .sig { color: var(--signal); }

  .panel__body { padding: 6px 20px 40px; }

  .presets { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 16px 0 6px; }

  /* gallery / uploads */
  .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 4px; }
  .thumb {
    position: relative; aspect-ratio: 1; border: 1px solid var(--hairline); border-radius: var(--r-2);
    background-size: cover; background-position: center; background-color: var(--space);
    transition: border-color var(--d-fast), transform var(--d-fast); overflow: hidden; cursor: none;
  }
  .thumb:hover { border-color: var(--trace); transform: translateY(-1px); }
  .thumb.active { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal-glow), 0 0 14px -6px var(--signal); }
  .thumb__tag {
    position: absolute; left: 3px; bottom: 3px; font-family: var(--ff-mono); font-size: 8px;
    letter-spacing: 0.04em; color: var(--bone); background: rgba(4,6,13,0.7); padding: 1px 3px; border-radius: 2px;
  }
  .thumb.active .thumb__tag { color: var(--signal); }
  .thumb--add {
    display: flex; align-items: center; justify-content: center; background-image: none;
    border-style: dashed; border-color: var(--trace); color: var(--ghost); font-size: 20px; font-weight: 300;
  }
  .thumb--add:hover { color: var(--signal); border-color: var(--signal-dim); }
  .preset {
    font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ash); background: var(--space); border: 1px solid var(--hairline);
    padding: 9px 4px; border-radius: var(--r-2); transition: all var(--d-fast) var(--e-out);
    line-height: 1.3;
  }
  .preset:hover { border-color: var(--trace); color: var(--bone); }
  .preset.active { border-color: var(--signal-dim); color: var(--signal); background: var(--signal-ghost); }

  .sect { margin-top: 22px; }
  .sect__label {
    font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--shadow); display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .sect__label::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }

  .ctrl { margin-bottom: 15px; }
  .ctrl__top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .ctrl__name { font-family: var(--ff-mono); font-size: 11.5px; letter-spacing: 0.02em; color: var(--ash); }
  .ctrl__val  { font-family: var(--ff-mono); font-size: 11px; color: var(--signal); letter-spacing: 0.02em; }

  /* range */
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: none;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 2px; background: var(--hairline);
    background-image: repeating-linear-gradient(90deg, var(--trace) 0, var(--trace) 1px, transparent 1px, transparent 13px);
  }
  input[type=range]::-moz-range-track { height: 2px; background: var(--hairline); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 4px; height: 16px; margin-top: -7px;
    background: var(--signal); border: 0; border-radius: 1px; box-shadow: 0 0 8px -1px var(--signal);
  }
  input[type=range]::-moz-range-thumb { width: 4px; height: 16px; background: var(--signal); border: 0; border-radius: 1px; }

  /* segmented radio */
  .seg { display: flex; gap: 0; border: 1px solid var(--hairline); border-radius: var(--r-2); overflow: hidden; }
  .seg button {
    flex: 1; font-family: var(--ff-mono); font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ghost); padding: 8px 4px; background: var(--space); transition: all var(--d-fast);
    border-right: 1px solid var(--hairline);
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { color: var(--bone); }
  .seg button.active { color: var(--void); background: var(--signal); font-weight: 600; }

  .ramp-input {
    width: 100%; font-family: var(--ff-mono); font-size: 13px; letter-spacing: 0.18em;
    color: var(--bone); background: var(--space); border: 1px solid var(--hairline);
    border-radius: var(--r-2); padding: 9px 10px; cursor: none;
  }
  .ramp-input:focus { outline: none; border-color: var(--signal-dim); }

  .btn-row { display: flex; gap: 6px; margin-top: 4px; }
  .btn {
    flex: 1; font-family: var(--ff-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ash); background: var(--space); border: 1px solid var(--hairline);
    padding: 10px 6px; border-radius: var(--r-2); transition: all var(--d-fast);
  }
  .btn:hover { border-color: var(--trace); color: var(--bone); }
  .btn.primary { color: var(--signal); border-color: var(--signal-dim); }
  .btn.primary.on { background: var(--signal); color: var(--void); font-weight: 600; }

  .note { font-family: var(--ff-mono); font-size: 10px; line-height: 1.6; color: var(--shadow); margin-top: 14px; letter-spacing: 0.02em; }
  .note .sig { color: var(--signal-dim); }

  /* ---------------- CURSOR (bracket reticle, lab-scoped) ---------------- */
  .labcur { position: fixed; top: 0; left: 0; z-index: 9999; pointer-events: none;
    width: 26px; height: 26px; transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 2px rgba(2,4,9,0.65)); will-change: transform; }
  .labcur__ring {
    position: absolute; inset: 0; color: var(--ash);
    --bw: 1.5px; --bl: 7px;
    background:
      linear-gradient(currentColor,currentColor) 0 0 / var(--bl) var(--bw) no-repeat,
      linear-gradient(currentColor,currentColor) 0 0 / var(--bw) var(--bl) no-repeat,
      linear-gradient(currentColor,currentColor) 100% 0 / var(--bl) var(--bw) no-repeat,
      linear-gradient(currentColor,currentColor) 100% 0 / var(--bw) var(--bl) no-repeat,
      linear-gradient(currentColor,currentColor) 0 100% / var(--bl) var(--bw) no-repeat,
      linear-gradient(currentColor,currentColor) 0 100% / var(--bw) var(--bl) no-repeat,
      linear-gradient(currentColor,currentColor) 100% 100% / var(--bl) var(--bw) no-repeat,
      linear-gradient(currentColor,currentColor) 100% 100% / var(--bw) var(--bl) no-repeat;
    transition: transform var(--d-fast) var(--e-snap), color var(--d-fast);
    transform: scale(0.92);
  }
  .labcur__pip { position: absolute; top: 50%; left: 50%; width: 2px; height: 2px; background: var(--ash); transform: translate(-50%,-50%); transition: background var(--d-fast); }
  .labcur__h, .labcur__v { position: absolute; top: 50%; left: 50%; background: var(--signal); opacity: 0; transition: opacity var(--d-fast); }
  .labcur__h { width: 15px; height: 1px; transform: translate(-50%,-50%); }
  .labcur__v { width: 1px; height: 15px; transform: translate(-50%,-50%); }
  .labcur__tag {
    position: absolute; top: 100%; left: 100%; margin: 4px 0 0 -6px;
    font-family: var(--ff-mono); font-size: 9px; letter-spacing: 0.1em; color: var(--ghost);
    text-transform: uppercase; white-space: nowrap; opacity: 0; transition: opacity var(--d-fast);
  }
  .labcur__tag::before { content: "+ "; color: var(--signal); }
  /* probe — over the stage */
  .labcur.is-probe .labcur__ring { transform: scale(1.5); color: var(--signal); }
  .labcur.is-probe .labcur__pip  { background: var(--signal); }
  .labcur.is-probe .labcur__h,
  .labcur.is-probe .labcur__v    { opacity: 0.85; }
  .labcur.is-probe .labcur__tag  { opacity: 1; }
  /* converted — whole image locked to ascii */
  .labcur.is-locked .labcur__ring { transform: scale(0.7); color: var(--pulse); }
  .labcur.is-locked .labcur__pip  { background: var(--pulse); }
  /* hot — over panel controls */
  .labcur.is-hot .labcur__ring { transform: scale(0.66); color: var(--signal); }
  .labcur.is-hot .labcur__pip  { background: var(--signal); }

  .panel::-webkit-scrollbar { width: 10px; }
  .panel::-webkit-scrollbar-track { background: rgba(255,255,255,0.015); border-left: 1px solid var(--hairline); }
  .panel::-webkit-scrollbar-thumb { background: var(--signal-dim); border: 1px solid rgba(0,240,200,0.3); border-radius: 0; background-clip: padding-box; }

  @media (max-width: 820px) {
    .lab { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .stage { border-right: 0; border-bottom: 1px solid var(--hairline); }
    .panel { max-height: 46vh; }
  }
</style>
</head>
<body>
<div class="lab">
  <!-- STAGE -->
  <div class="stage" id="stage">
    <canvas class="stage__canvas" id="cv"></canvas>
    <div class="stage__frame"><span class="stage__tick bl"></span><span class="stage__tick br"></span></div>

    <div class="stage__hud">
      <div class="row"><span class="k">SOURCE</span><b id="hudSrc">wafer-sample.jpg</b></div>
      <div class="row"><span class="k">MODE</span><b id="hudMode" class="sig">SCAN-IN · FULL</b></div>
      <div class="row"><span class="k">GRID</span><b id="hudGrid">— × —</b></div>
    </div>

    <div class="stage__readout">
      <span><span class="dot"></span><span class="fps" id="fps">-- FPS</span></span>
      <span class="hint"><kbd>CLICK</kbd> / <kbd>SPACE</kbd> convert all · drag photo to load</span>
    </div>

    <div class="stage__drop">drop image to load</div>
  </div>

  <!-- PANEL -->
  <aside class="panel">
    <div class="panel__head">
      <div class="panel__title">ASCII Photo Lab</div>
      <div class="panel__sub">reveal-lens tuning <span class="sig">·</span> dial before port</div>
    </div>
    <div class="panel__body" id="body"></div>
  </aside>
</div>

<!-- cursor -->
<div class="labcur" id="cur">
  <div class="labcur__ring"></div>
  <div class="labcur__pip"></div>
  <div class="labcur__h"></div>
  <div class="labcur__v"></div>
  <div class="labcur__tag" id="curtag">probe</div>
</div>

<script src="ascii-photo.js"></script>
<script src="lab-ui.js"></script>
</body>
</html>
