<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>M.O. — Preloader study · RESOLUTION</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" />
<style>
:root{--bg:#05060a;--ink:#e2e8f0;--acc:#00f0c8;--gut:34px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
a{color:var(--acc)}a:hover{color:#7ffbe6}

/* ── STAGE 0 · pure CSS, paints before any script ──────────────────────
   This is what the visitor sees on the very first frame of the document:
   no canvas, no WebGL, no React, no font wait. The field already exists,
   it is simply not yet resolved. */
.pl{position:fixed;inset:0;z-index:60;background:var(--bg);transition:opacity 420ms linear}
.pl.is-out{opacity:0}
.pl__seed{position:absolute;inset:0;opacity:.55;transition:opacity 700ms linear;
  background:
    radial-gradient(1.6px 1.6px at 18% 26%,rgba(226,232,240,.5),transparent 60%),
    radial-gradient(1.8px 1.8px at 71% 14%,rgba(226,232,240,.42),transparent 60%),
    radial-gradient(1.4px 1.4px at 44% 63%,rgba(226,232,240,.46),transparent 60%),
    radial-gradient(2px 2px at 86% 71%,rgba(226,232,240,.34),transparent 60%),
    radial-gradient(1.5px 1.5px at 29% 84%,rgba(226,232,240,.4),transparent 60%),
    radial-gradient(1.7px 1.7px at 61% 41%,rgba(226,232,240,.3),transparent 60%);
  filter:blur(1.4px)}
.pl.is-live .pl__seed{opacity:0}
.pl__cv{position:absolute;inset:0;display:block}

/* corner reticles — the Title's own geometry, present from frame one and
   sharpening with the field. At 0xFF they ARE the Title's reticles. */
.pl__ret{position:absolute;inset:var(--gut);pointer-events:none}
.pl__c{position:absolute;width:15px;height:15px;opacity:.3}
.pl__c::before,.pl__c::after{content:"";position:absolute;background:var(--acc);opacity:.85}
.pl__c::before{width:15px;height:1px}.pl__c::after{width:1px;height:15px}
.pl__c--tl{top:0;left:0}.pl__c--tl::before{top:0;left:0}.pl__c--tl::after{top:0;left:0}
.pl__c--tr{top:0;right:0}.pl__c--tr::before{top:0;right:0}.pl__c--tr::after{top:0;right:0}
.pl__c--bl{bottom:0;left:0}.pl__c--bl::before{bottom:0;left:0}.pl__c--bl::after{bottom:0;left:0}
.pl__c--br{bottom:0;right:0}.pl__c--br::before{bottom:0;right:0}.pl__c--br::after{bottom:0;right:0}

/* readout — the same instrument as the scrollbar, at the moment of entry */
.pl__read{position:absolute;right:var(--gut);bottom:var(--gut);text-align:right;line-height:1;
  display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-variant-numeric:tabular-nums}
.pl__pct{font-size:11px;font-weight:500;letter-spacing:.06em;color:rgba(226,232,240,.72)}
.pl__hex{font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--acc)}
.pl--hexonly .pl__pct{display:none}
.pl--hexonly .pl__hex{font-size:15px;letter-spacing:.18em}
.pl__scale{position:absolute;right:var(--gut);bottom:calc(var(--gut) + 34px);width:1px;height:96px;background:linear-gradient(to top,rgba(226,232,240,.14),rgba(226,232,240,.02))}
.pl__scale i{position:absolute;right:0;width:7px;height:1px;background:var(--acc);box-shadow:0 0 8px rgba(0,240,200,.5);transition:none}

/* handoff stub — stands in for the real Title */
.ho{position:fixed;inset:0;z-index:40;opacity:0;transition:opacity 420ms linear}
.ho.is-on{opacity:1}
.ho__mark{position:absolute;left:var(--gut);bottom:calc(var(--gut) - 8px);font-size:clamp(64px,13vw,190px);font-weight:600;letter-spacing:-.03em;line-height:.82;color:var(--ink)}
.ho__sub{position:absolute;left:var(--gut);top:calc(var(--gut) + 30px);font-size:10px;letter-spacing:.16em;color:rgba(226,232,240,.42)}

/* lab controls — not part of the concept. Anchored top-centre, clear of the
   corner reticles and the handoff wordmark, which both key to the gutter. */
.lab{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:90;display:flex;gap:6px;align-items:center;background:rgba(5,6,10,.72);padding:6px 10px;border:1px solid rgba(226,232,240,.08)}
.lab button{background:rgba(226,232,240,.05);border:1px solid rgba(226,232,240,.14);color:rgba(226,232,240,.5);font:inherit;font-size:9px;letter-spacing:.14em;padding:7px 11px;cursor:pointer;transition:all 140ms linear}
.lab button:hover{color:var(--ink);border-color:rgba(226,232,240,.3)}
.lab button.is-on{color:var(--acc);border-color:rgba(0,240,200,.4);background:rgba(0,240,200,.07)}
.lab__note{font-size:9px;letter-spacing:.1em;color:rgba(226,232,240,.24);margin-left:8px}
@media (max-width:700px){:root{--gut:18px}.lab{flex-wrap:wrap;justify-content:center;max-width:94vw}.lab__note{display:none}}
</style>
</head>
<body>

<div class="ho" id="ho">
  <div class="ho__sub">HANDOFF — the real Title resolves here, same canvas</div>
  <div class="ho__mark">M.O.</div>
</div>

<div class="pl" id="pl">
  <div class="pl__seed"></div>
  <canvas class="pl__cv" id="cv"></canvas>
  <div class="pl__ret" id="ret">
    <span class="pl__c pl__c--tl"></span><span class="pl__c pl__c--tr"></span>
    <span class="pl__c pl__c--bl"></span><span class="pl__c pl__c--br"></span>
  </div>
  <div class="pl__scale"><i id="tick"></i></div>
  <div class="pl__read">
    <div class="pl__pct" id="pct">00%</div>
    <div class="pl__hex" id="hex">0x00</div>
  </div>
</div>

<div class="lab">
  <button id="bReplay">REPLAY</button>
  <button id="bBoth" class="is-on">WITH %</button>
  <button id="bHex">HEX ONLY</button>
  <span class="lab__note">progressive sampling · halton · positions never move</span>
</div>

<script>
(function(){
const pl=document.getElementById('pl'),cv=document.getElementById('cv'),ctx=cv.getContext('2d',{alpha:false});
const pctEl=document.getElementById('pct'),hexEl=document.getElementById('hex'),tick=document.getElementById('tick');
const ret=document.getElementById('ret'),ho=document.getElementById('ho');
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE=innerWidth<=760;
const N_MAX=MOBILE?1500:3400;

/* Halton — ANY prefix of the sequence is uniformly distributed. That is the
   whole trick: revealing more points looks like the same field sampled at a
   higher rate, never like new debris appearing somewhere. */
function halton(i,b){let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b);}return r;}
const P=new Float32Array(N_MAX*3);
for(let i=0;i<N_MAX;i++){P[i*3]=halton(i+1,2);P[i*3+1]=halton(i+1,3);P[i*3+2]=halton(i+1,5);}

/* soft sprite for the coarse, under-resolved stage */
const spr=document.createElement('canvas');spr.width=spr.height=32;
{const s=spr.getContext('2d'),g=s.createRadialGradient(16,16,0,16,16,16);
 g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.45,'rgba(255,255,255,.42)');g.addColorStop(1,'rgba(255,255,255,0)');
 s.fillStyle=g;s.fillRect(0,0,32,32);}

let W=0,H=0,DPR=1;
function size(){DPR=Math.min(1.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);}
size();addEventListener('resize',size);

/* Simulated readiness. On the real page these are the actual milestones:
   document parsed · tokens+fonts · three.js · universe init · first WebGL
   frame · title laid out. Discrete events, smoothed so the readout ticks. */
const MILE=[[120,.14],[380,.30],[900,.52],[1450,.74],[2050,.93],[2450,1]];
let t0=0,target=0,prog=0,done=false,mi=0,holdAt=0;

function reset(){t0=performance.now();target=0;prog=0;done=false;mi=0;holdAt=0;
  pl.classList.remove('is-out');pl.classList.add('is-live');ho.classList.remove('is-on');}

function frame(now){
  const el=now-t0;
  while(mi<MILE.length&&el>=MILE[mi][0]){target=MILE[mi][1];mi++;}
  prog+=(target-prog)*(REDUCED?.22:.075);
  if(target>=1&&prog>.996)prog=1;
  const res=prog;

  /* three axes of ONE idea, all monotonic:
     count ↑  ·  quantisation cell ↓  ·  point size ↓ */
  const n=Math.max(24,Math.floor(N_MAX*(0.008+0.992*Math.pow(res,1.9))));
  const cell=REDUCED?0:52*Math.pow(1-res,1.7);
  const soft=1-res;
  const t=REDUCED?0:(now-t0)*0.001;
  const cx=W/2,cy=H/2,ang=t*0.035,ca=Math.cos(ang),sa=Math.sin(ang);
  const spread=1.28+0.10*Math.sin(t*0.22);

  ctx.fillStyle='#05060a';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const d=0.46+P[i*3+2]*0.86;                    // depth
    let ux=(P[i*3]-0.5),uy=(P[i*3+1]-0.5);
    const rx=ux*ca-uy*sa,ry=ux*sa+uy*ca;           // slow field rotation
    let px=cx+rx*W*spread/d, py=cy+ry*H*spread/d;
    if(cell>0.5){                                   // coarse spatial sampling
      px=Math.floor(px/cell)*cell+cell/2;
      py=Math.floor(py/cell)*cell+cell/2;
    }
    if(px<-40||px>W+40||py<-40||py>H+40)continue;
    const s=(0.55+3.4*soft)/d;
    const a=(0.10+0.62*res)*(1.25-d*0.55)*(0.55+0.45*soft);
    if(s<1.05){ctx.fillStyle='rgba(226,240,248,'+Math.min(1,a*1.5).toFixed(3)+')';ctx.fillRect(px,py,1,1);}
    else{ctx.globalAlpha=Math.min(1,a);ctx.drawImage(spr,px-s,py-s,s*2,s*2);ctx.globalAlpha=1;}
  }
  ctx.globalCompositeOperation='source-over';

  /* the reticles resolve on the same curve as the field */
  ret.style.filter=soft>0.02?'blur('+(soft*3.4).toFixed(2)+'px)':'none';
  ret.style.opacity=(0.25+0.75*res).toFixed(3);

  const v=Math.round(res*255);
  hexEl.textContent='0x'+v.toString(16).toUpperCase().padStart(2,'0');
  pctEl.textContent=String(Math.round(res*100)).padStart(2,'0')+'%';
  tick.style.bottom=(res*95).toFixed(1)+'px';

  if(prog>=1&&!done){done=true;holdAt=now;}
  if(done&&now-holdAt>220){pl.classList.add('is-out');ho.classList.add('is-on');}
  if(done&&now-holdAt>2600)reset();                 // loop for judging
  requestAnimationFrame(frame);
}
reset();requestAnimationFrame(frame);

const bB=document.getElementById('bBoth'),bH=document.getElementById('bHex');
bB.onclick=()=>{pl.classList.remove('pl--hexonly');bB.classList.add('is-on');bH.classList.remove('is-on');};
bH.onclick=()=>{pl.classList.add('pl--hexonly');bH.classList.add('is-on');bB.classList.remove('is-on');};
document.getElementById('bReplay').onclick=reset;
})();
</script>
</body>
</html>
