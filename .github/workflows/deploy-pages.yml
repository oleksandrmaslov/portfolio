name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node for the landing runtime check
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/landing-runtime/package-lock.json

      - name: Verify generated landing runtime
        run: |
          npm ci --prefix tools/landing-runtime --include=dev --ignore-scripts --no-audit --no-fund
          npm run check --prefix tools/landing-runtime

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # JSX is build input only. The landing serves app/landing/runtime.js and
      # every other public route serves an app/page-runtimes bundle, so the
      # authored app/demo JSX must not be duplicated in the Pages artifact.
      - name: Stage static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.agents/' \
            --exclude='_site/' \
            --exclude='face-test.html' \
            --exclude='tools/' \
            --exclude='studies/' \
            --exclude='*.md' \
            --exclude='app/*.jsx' \
            --exclude='app/**/*.jsx' \
            --exclude='demo/*.jsx' \
            --exclude='demo/**/*.jsx' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
