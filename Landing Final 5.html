  <!-- FINAL 5 entry scene. It is the only render-critical style on purpose. -->
  <style>
    html.mo-origin-on,
    html.mo-origin-on body { overflow: hidden; background: #05060a; }
    #mo-pl {
      --p: .0039;
      --pl-bg: #05060a;
      --pl-ink: #dfe5ec;
      --pl-track: #202833;
      --pl-signal: #00d8b5;
      position: fixed;
      inset: 0;
      z-index: 120;
      overflow: hidden;
      isolation: isolate;
      color: var(--pl-ink);
      background: var(--pl-bg);
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      transition: background-color 180ms linear, opacity 180ms linear;
    }
    #mo-pl.is-transparent { background-color: transparent; }
    #mo-pl.is-out { opacity: 0; pointer-events: none; }
    .mo-pl__line {
      position: absolute;
      top: 50%;
      left: clamp(18px, 4vw, 64px);
      right: clamp(18px, 4vw, 64px);
      display: grid;
      grid-template-columns: minmax(24px, 1fr) auto minmax(24px, 1fr);
      align-items: center;
      gap: clamp(12px, 2vw, 28px);
      transform: translateY(-50%);
      transition: opacity 140ms linear;
    }
    .mo-pl__rail {
      position: relative;
      height: 1px;
      overflow: hidden;
      background: var(--pl-track);
      transition: transform 260ms cubic-bezier(.76, 0, .24, 1);
    }
    .mo-pl__rail::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--pl-signal);
      transform: scaleX(var(--p));
      will-change: transform;
    }
    .mo-pl__rail--left { transform-origin: 100% 50%; }
    .mo-pl__rail--left::after { transform-origin: 0 50%; }
    .mo-pl__rail--right { transform-origin: 0 50%; }
    .mo-pl__rail--right::after { transform-origin: 100% 50%; }
    .mo-pl__address {
      display: flex;
      align-items: baseline;
      justify-content: center;
      min-width: 68px;
      color: var(--pl-signal);
      font: 500 clamp(13px, 1.1vw, 16px)/44px "Geist Mono", ui-monospace, monospace;
      letter-spacing: .16em;
      transition: color 100ms linear;
    }
    .mo-pl__address span {
      display: block;
      animation: mo-code-register 280ms cubic-bezier(.16, 1, .3, 1) both;
    }
    .mo-pl__address span:nth-child(2) { animation-delay: 28ms; }
    .mo-pl__address span:nth-child(3) { animation-delay: 56ms; }
    .mo-pl__address span:nth-child(4) { animation-delay: 84ms; }
    #mo-pl.is-ready .mo-pl__address { color: var(--pl-ink); animation: mo-code-lock 120ms steps(2, end) 1; }
    #mo-pl.is-handoff .mo-pl__rail { transform: scaleX(0); }
    #mo-pl.is-transparent .mo-pl__line { opacity: 0; }
    .mo-pl__sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @keyframes mo-code-register {
      from { opacity: 0; transform: translateY(-11px) scaleY(1.25); filter: blur(2px); text-shadow: 0 -8px 0 rgba(0, 216, 181, .22); }
      to { opacity: 1; transform: translateY(0) scaleY(1); filter: none; text-shadow: 0 0 0 transparent; }
    }
    @keyframes mo-code-lock { 50% { opacity: .54; } }
    @media (prefers-reduced-motion: reduce) {
      .mo-pl__address span { animation: none; }
      #mo-pl.is-ready .mo-pl__address { animation: none; }
      #mo-pl,
      #mo-pl * { transition-duration: 80ms !important; }
    }
  </style>
  <script>
    document.documentElement.classList.add("mo-origin-on");
    window.__mo_origin_watchdog = setTimeout(function () {
      var p = document.getElementById("mo-pl");
      var app = document.getElementById("root");
      document.documentElement.classList.remove("mo-origin-on");
      if (p) p.remove();
      if (app) {
        app.inert = false;
        app.removeAttribute("aria-hidden");
      }
      try { window.dispatchEvent(new CustomEvent("mo:preloader-done")); } catch (_) {}
    }, 12000);
  </script>

  <script type="text/babel" data-presets="env,react">
    function KeyButton({ children, legend = "↵", primary, onPress }) {
      const { useState } = React;
      const [pressed, setPressed] = useState(false);
      const [lit, setLit] = useState(false);
      const fire = (e) => {
        setPressed(true);
        setLit(true);
        if (window.MOSound) { window.MOSound.unlock(); window.MOSound.thock({ vel: 0.85 }); }
        if (window.__mo_disturb && e && e.currentTarget && e.currentTarget.getBoundingClientRect) {
          const r = e.currentTarget.getBoundingClientRect();
          window.__mo_disturb(r.left + r.width / 2, r.top + r.height / 2, 0.8);
        }
        onPress && onPress();
        setTimeout(() => { setPressed(false); if (window.MOSound) window.MOSound.thockUp(); }, 140);
        setTimeout(() => setLit(false), 520);
      };
      const onKey = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fire(); } };
      return (
        <button
          className={"key " + (pressed ? "key--down " : "") + (lit ? "key--lit " : "") + (primary ? "key--primary" : "")}
          onClick={fire}
          onKeyDown={onKey}
        >
          <span className="key__cap">
            <span className="key__legendTop">{legend}</span>
            <span className="key__label">{children}</span>
          </span>
          <span className="key__shadow" aria-hidden="true" />
        </button>
      );
    }
    window.KeyButton = KeyButton;
  </script>
