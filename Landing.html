<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maslov Oleksandr — Embedded · Firmware · Hardware</title>
  <meta name="description" content="Maslov Oleksandr — embedded developer, firmware engineer, hardware designer. Munich. Wafer keyboard. Kerfur. ZMK ecosystem. Open source." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />

  <!-- Tokens + shared system -->
  <link rel="stylesheet" href="system/tokens.css" />
  <link rel="stylesheet" href="system/layout.css" />
  <link rel="stylesheet" href="system/extras.css" />
  <link rel="stylesheet" href="landing/landing.css" />
  <link rel="stylesheet" href="landing/landing-scroll.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Three.js (ESM) + GLTFLoader, exposed on window.THREE for the
       non-module Babel-standalone scripts below. examples/js/ was removed
       in three r149, so the loader must come from examples/jsm/. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    // The module namespace is frozen — can't attach GLTFLoader to it directly.
    // Spread into a plain object so non-module code can read both.
    window.THREE = Object.assign({}, THREE, { GLTFLoader });
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared core (boot, fib grid, cursor) + key button -->
  <script type="text/babel" data-presets="env,react" src="system/core.jsx"></script>
  <script type="text/babel" data-presets="env,react">
    // Lift KeyButton out of sections2 (which has many heavy imports we don't need here)
    function KeyButton({ children, legend = "↵", primary, onPress }) {
      const { useState } = React;
      const [pressed, setPressed] = useState(false);
      const [lit, setLit] = useState(false);
      const fire = () => {
        setPressed(true);
        setLit(true);
        onPress && onPress();
        setTimeout(() => setPressed(false), 140);
        setTimeout(() => setLit(false), 520);
      };
      const onKey = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fire(); } };
      return (
        <button
          className={"key " + (pressed ? "key--down " : "") + (lit ? "key--lit " : "") + (primary ? "key--primary" : "")}
          onClick={fire}
          onKeyDown={onKey}
        >
          <span className="key__cap">
            <span className="key__legendTop">{legend}</span>
            <span className="key__label">{children}</span>
          </span>
          <span className="key__shadow" aria-hidden="true" />
        </button>
      );
    }
    window.KeyButton = KeyButton;
  </script>

  <!-- Landing -->
  <script type="text/babel" data-presets="env,react" src="landing/ascii.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project/viewer3d.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="landing/universe.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="landing/landing.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="landing/app.jsx"></script>
</body>
</html>
