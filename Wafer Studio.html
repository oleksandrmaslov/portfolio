<body>
  <script src="system/node-seam.js" data-node-addr="0x06" data-node-name="Wafer Studio"></script>
  <div id="root"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
    window.THREE = Object.assign({}, THREE, { GLTFLoader, MeshoptDecoder, RoomEnvironment, RoundedBoxGeometry, KTX2Loader });
    window.dispatchEvent(new Event("three-ready"));
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- ASCII photo reveal-lens -->
  <script src="lab/ascii-photo/ascii-photo.js"></script>

  <!-- v3: solid materials (replaces matcap) -->
  <script src="project_v3/solid-materials.js"></script>

  <!-- Project pieces (v3 rig) -->
  <script type="text/babel" data-presets="env,react" src="project/data.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project/viewer3d.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project_v3/hero-rig.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="lab/ascii-photo/ascii-figure.jsx"></script>

  <!-- Page config — everything project-specific lives here -->
  <script type="text/babel" data-presets="env,react">
    window.PAGE_CONFIG = {
      addr: "0x06",
      docTitle: "Wafer Studio — Maslov Oleksandr",
      hero: {
        model: "models/wafer-mark.glb",
        modelFit: 2.1,
        pose: { x: -0.18, y: 0, z: 0 },
      },
      heroLayout: {
        desktop: { fracX: 0.46, scale: 0.78, offY: 0.22 },
        tablet:  { fracX: 0.26, scale: 0.66, offY: 0.30 },
        mobile:  { fracX: 0,    scale: 0.50, offY: 1.05 },
      },
      link: {
        label: "OPEN THE CONFIGURATOR",
        href: "https://oleksandrmaslov.github.io/wafer-studio/",
        hint: "RUNS IN THE BROWSER · USB",
      },
    };

  <!-- Page core v3 — generalized template + generic node handoff protocol -->
  <script type="text/babel" data-presets="env,react" src="project_v2/page-core.jsx"></script>
