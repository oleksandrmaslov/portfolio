<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iskra — Maslov Oleksandr</title>
  <meta name="description" content="Iskra · project case file · Maslov Oleksandr · volunteer flashing station for Energy for Ukraine · two-phase factory-safe firmware flashing, now with a 3D operator bench: inspect the board, match the firmware, flash it, watch it assemble." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" />

  <link rel="stylesheet" href="system/tokens.css" />
  <link rel="stylesheet" href="system/layout.css" />
  <link rel="stylesheet" href="system/extras.css" />
  <link rel="stylesheet" href="project/page.css" />
  <link rel="stylesheet" href="project_v2/page2.css" />
  <link rel="stylesheet" href="demo/demo.css" />
  <link rel="stylesheet" href="lab/ascii-photo/ascii-figure.css" />
  <link rel="stylesheet" href="system/cursor.css" />
  <link rel="stylesheet" href="system/scrollbar.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Three.js (ESM) exposed on window.THREE for the Babel scripts below -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    window.THREE = Object.assign({}, THREE, { GLTFLoader, MeshoptDecoder, RoomEnvironment, RoundedBoxGeometry });
    window.dispatchEvent(new Event("three-ready"));
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared system (FibGrid, Boot, Cursor) -->
  <script type="text/babel" data-presets="env,react" src="system/core.jsx"></script>



  <!-- ASCII photo reveal-lens (lab engine + React figure wrapper) -->
  <script src="lab/ascii-photo/ascii-photo.js"></script>

  <!-- Project pieces -->
  <script type="text/babel" data-presets="env,react" src="project/data.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project/viewer3d.jsx"></script>
  <script src="project_v3/solid-materials.js"></script>
  <script type="text/babel" data-presets="env,react" src="project_v3/hero-rig.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="project_v2/tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="lab/ascii-photo/ascii-figure.jsx"></script>


  <!-- Page config — everything project-specific lives here -->
  <script type="text/babel" data-presets="env,react">
    window.PAGE_CONFIG = {
      addr: "0x03",
      docTitle: "Iskra — Maslov Oleksandr",
      hero: {
        model: "models/iskra-mark.glb",
        modelFit: 2.1,
        pose: { x: -0.2, y: 0, z: 0 },
      },
      /* the mark is a wide solid shape — it sits further right and higher than
         the default so the metrics row and stack meta stay on clean ground. */
      heroLayout: {
        desktop: { fracX: 0.46, scale: 0.78, offY: 0.22 },
        tablet:  { fracX: 0.26, scale: 0.66, offY: 0.30 },
        mobile:  { fracX: 0,    scale: 0.50, offY: 1.05 },
      },
      link: {
        label: "VIEW ON GITHUB",
        href: "https://github.com/oleksandrmaslov/iskra",
        hint: "FLASHING STATION · SOURCE",
      },
      tweakDefaults: /*EDITMODE-BEGIN*/{
        "idleSpin": true
      }/*EDITMODE-END*/,
      renderTweaks: (t, set) => (
        <>
          <TweakSection label="Model" />
          <TweakToggle label="Idle auto-rotate" value={t.idleSpin}
                       onChange={(v) => set("idleSpin", v)} />
        </>
      ),
    };
  </script>

  <!-- Page core (generalized v2 template) -->
  <script src="system/cursor-distortion.js"></script>
  <script type="text/babel" data-presets="env,react" src="project_v2/page-core.jsx"></script>

  <!-- ASCII RAMP scrollbar (shared w/ Landing v11) -->
  <script src="landing_v11/landing-scrollbar.js"></script>
</body>
</html>
